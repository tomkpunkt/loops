    "Überfahrt": { name: "Crossing", quip: "Cargo and test subject on the same bridge. What could possibly go wrong.",
      hints: ["The switch is beyond the acid, the cube in front of it. Neither of them can swim.", "Light bridges carry cubes too. When pushed, a cube rides a bridge surprisingly happily.", "Lay the bridge out of the left wall just above the floor using a portal. Then push the cube across the acid onto the switch and follow it."] },
    "Deckung": { name: "Cover", quip: "The floor is unfortunately not walkable today. Improvise.",
      hints: ["The laser sweeps the whole floor. The whole of it. We were thorough.", "A cube in the beam casts a shadow. Life in the shadow lasts longer.", "Push the cube off the ledge into the beam and land right behind it. Then carry on to the exit in its shadow."] },
    "Lichtschranke": { name: "Light Barrier", quip: "Two beams, one portal. Efficiency is our core competence.",
      hints: ["Laser and bridge hit the same block. You will hopefully hit the exit.", "A portal pair redirects everything that goes in. Even two things at once. Efficiency, without any effort from you.", "One portal on the block that laser and bridge hit, the other low on the left wall. Keep your head down on the bridge, the beam runs just above it."] },
    "Finale": { name: "Finale", quip: "Final chamber. We have planned a graduation ceremony. Theoretically.",
      hints: ["The door wants switch and receiver, and acid lies between you and both. A finale. We made an effort.", "Bridge first, laser second. One portal pair, two jobs, and cubes love riding bridges.", "Lay the bridge across the acid with a portal and push the cube onto the switch. Then reset the portals from the far bank and send the laser to the receiver."] },
    "Echo": { name: "Echo", quip: "You are back again. And again.",
      hints: ["New: Echo. Press \"Echo\" ({echoKey}), walk to the switch and press again. Time jumps back and your echo repeats everything you did.", "Your echo stays put at the end of its recording. An echo on a switch is a switch that stays pressed. A brilliant invention, in case you were wondering.", "Start recording, step onto the switch, stop recording. While your echo waits there, walk through the open door yourself."] },
    "Zweite Schicht": { name: "Second Shift", quip: "Teamwork with yourself. HR is thrilled.",
      hints: ["One switch is up on the ledge, one down below. You are only one of you. For now.", "Your echo can fire and use portals just like you. It just makes fewer mistakes, because it already knows yours.", "Record the trip up to the upper switch by portal. After that, deal with the cube for the lower one yourself."] },
    "Stellvertreter": { name: "Stand-in", quip: "Someone has to hold the fort. Not you, this time.",
      hints: ["The switch is in a sealed cell. Whoever stands there never reaches the door.", "There are two of you. One of them is expendable. Guess which.", "Record yourself getting behind the grille onto the switch by portal. Stop recording, then walk through the door yourself."] },
    "Arbeitsteilung": { name: "Division of Labor", quip: "Division of labor: one sits in a hole, one works. Classic.",
      hints: ["From the pit at the bottom right you see no white surface, and you won't get out either. The door still wants switch and receiver.", "Someone has to stand on the switch, someone has to redirect the laser. Delegate the boring half.", "Record yourself walking to the switch and stop recording there. Then place the portals yourself and send the laser to the receiver."] },
    "Turmbau": { name: "Tower", quip: "Please stand on yourself. That is not a typo.",
      hints: ["The ledge is three tiles high. Your jump manages two. The missing tile is you.", "An echo is solid enough to stand on. So is a cube. Stacked, both are higher.", "Push the cube against the wall, record yourself jumping onto it, stop recording. Then onto the cube and from there onto your echo's head."] },
    "Schleuse": { name: "Airlock", quip: "An airlock. It protects us from you. And you from yourself.",
      hints: ["Two doors, two channels: yellow opens yellow, teal opens teal. The cube you need sits under the grille in the floor. Neatly stored away.", "Your echo holds one switch, the cube has to hold the other. Two portals get it out of its hole.", "Leave your echo on the yellow switch. Then put a portal under the cube through the grille, one on the white wall on the left, and push the cube through the yellow door onto the teal switch."] },
    "Lichtwache": { name: "Light Watch", quip: "Please hold the gate. Yes, you. The other you.",
      hints: ["A gate in the laser's path only opens while someone stands on the switch. You cannot stand and aim at the same time. We have watched you try.", "Your echo can stand. Standing is its great talent.", "Record yourself walking to the switch and stop recording there. Then route the beam through the open gate to the teal receiver with a portal."] },
    "Doppelbelegung": { name: "Double Booking", quip: "This cell is for exactly one person. You are two. Do the math.",
      hints: ["New: key cards. While one is missing, the exit stays locked. One lies in a cell nobody comes back from.", "Your echo collects cards for you, even in places that would be the end of the line for you. First, though, you have to get across.", "Fly across from the ledge via a floor portal and out of the left wall. Over there, record yourself dropping through a portal and the grille into the cell above. Your echo fetches the card, you go to the exit."] },
    "Fernzündung": { name: "Remote Trigger", quip: "A time fuse made only of people. We are very proud.",
      hints: ["In the shaft you build up speed, but you cannot see the target from there. A classic case of a poor view.", "Your echo can place portals while you fall. Teamwork across time.", "Record yourself waiting outside and, after a while, putting the portal on the block. Then build up speed in the loop in the shaft and let your echo redirect you."] },
    "Brückenwächter": { name: "Bridge Keeper", quip: "A keeper, a bridge, an abyss. A classic bedtime story.",
      hints: ["The bridge ends at a door above the acid. The door only opens while someone stands on the switch.", "Someone on the switch, someone on the bridge. Two someones. Lucky you, you can be two.", "Record yourself walking onto the switch and stop recording. Then lay the bridge with a portal and walk across through the open door."] },
    "Türkeil": { name: "Door Wedge", quip: "A door does not close on what stands in it. We consider that a design flaw. You consider it a tool.",
      hints: ["The card lies beyond the second door, the exit at the far left, and both switches sit on steps no cube can climb. New: a door does not close while something stands in it.", "A new echo replaces the old one. The old one vanishes from its switch, and its door shuts. Unless something is jammed in it.", "First echo onto the yellow switch. Then push the cube into the yellow door so it stays open. Second echo onto the teal switch, grab the card and go back through both doors to the exit."] },
    "Torwächter": { name: "Gatekeeper", quip: "One throws, one holds. Like a circus, minus the applause.",
      hints: ["The cube has to reach the switch on the right, and a teal gate stands in between. The switch for the gate is under the ledge.", "Cubes fly through portals, and gates stay open as long as your echo wants them to.", "Your echo holds the switch under the ledge. Then fling the cube through a portal and the open gate onto the switch on the right, and fly after it the same way."] },
    "Leibwache": { name: "Bodyguard", quip: "Your echo feels no pain. We specifically asked.",
      hints: ["The switch opens the exit, but also the gate in front of the laser. Then the whole floor is deadly. For you.", "Your echo is immune to lasers. An immune body in the beam is a wall with your face on it.", "Record yourself standing so that your echo will catch the beam. Then press the switch yourself and walk to the exit in its shadow."] },
    "Durchflug": { name: "Fly-through", quip: "Please do not fly into closed gates. The gates complain.",
      hints: ["New: crackling blue floors are live and kill on contact. This time you have to fly through the gate yourself. The gate only opens while someone stands on the switch below.", "Whatever your echo recorded, it keeps doing, even if you change the portals later. The kind of loyalty one dreams of.", "Leave your echo on the switch below. Then set the portals for the flight and launch yourself through the open gate."] },
    "Generalprobe": { name: "Dress Rehearsal", quip: "Dress rehearsal. Mistakes are allowed. Repeats too. Many.",
      hints: ["The door wants switch and receiver, and the live floor is in the way again. Dress rehearsal means: no cube this time.", "Your echo can ride bridges too. And it waits at the destination for as long as you like.", "Lay the bridge and record yourself crossing onto the switch. Then reset the portals from the far bank and send the laser to the receiver."] },
    "Abschlussprüfung": { name: "Final Exam", quip: "Last exam of this series. Your reward lies behind the door. Really, this time.",
      hints: ["Switch in the sealed cell, laser to the receiver, both for the same door. The card is in the cell too. Right at the top, naturally.", "Whatever your echo picks up on its way belongs to you. Even if it has to jump for it.", "Record yourself dropping into the cell by portal, jumping up under the card and staying on the switch. Then reset the portals and send the laser to the receiver. Something new waits beyond."] },
    "Greifarm": { name: "Grabber", quip: "Please only grab cubes. There have been incidents.",
      hints: ["New: gravity gun. G or \"Grab\" picks up a cube, even through a grille, V or \"Throw\" hurls it where you aim. The cube is above you, the switch high up on the right beyond the flames. New: flames burn you instantly, cubes only temporarily.", "Grabbing works through grilles. Throwing works across flames. Combining them is up to you. We believe in you.", "Grab the cube from below through the grille, aim diagonally up and to the right and throw it onto the switch. Then go left through the open door."] },
    "Würfelschild": { name: "Cube Shield", quip: "A cube as a shield. Precisely what it was not designed for.",
      hints: ["The laser sweeps the floor, with live patches in between. Pushing won't do here, you have to jump.", "A held cube floats wherever you aim. Including between you and a laser. Especially there.", "Grab the cube and aim toward the laser so it floats in front of you. Shielded like that, jump the live patches to the exit."] },
    "Ballistik": { name: "Ballistics", quip: "Physics class, practical part. There never was a theory part.",
      hints: ["The switch is up top, past a hole in the ceiling. Climbing up is not part of the plan.", "Cubes fly where you aim. Diagonally upward is also a direction.", "Grab the cube, stand close beneath the ceiling hole and throw diagonally upward through it. It lands on the switch."] },
    "Rohrpost": { name: "Pneumatic Post", quip: "Parcel en route. Recipient: a switch. No return receipt.",
      hints: ["The switch is in a cell behind the grille, and you cannot reach the white surface high on the left wall.", "A thrown cube reaches places you cannot. Through portals it flies even further. Envy is inappropriate here.", "One portal high on the left wall, the other on the ceiling of the cell behind the grille. Then throw the cube into the wall portal, and it drops onto the switch in the cell."] },
    "Katapult": { name: "Catapult", quip: "Portal-powered projectile. Insurance has not been informed.",
      hints: ["The switch is on an island behind a wall. Throwing alone won't do, we built the wall extra high.", "A throw down into a floor portal is faster than any fall. What goes in fast comes out fast.", "One portal in the floor of the pit, one on the left wall. Throw the cube hard down into the pit, and it shoots out of the wall over the barrier onto the island."] },
    "Hebebühne": { name: "Lift Platform", quip: "Your echo lifts for you. You lift for no one. Typical.",
      hints: ["The ledge is too high, and the door in front of it only opens with the switch up on the left. So you need the cube twice. Not at the same time. One after the other, though.", "Your echo can hold a cube and throw it later. It sticks to the plan, even when you are long gone.", "Record this: grab the cube, aim up, wait at the wall until you would be on top, then throw the cube onto the switch. Meanwhile climb over echo and cube onto the ledge and wait at the door."] },
    "Zuspiel": { name: "Assist", quip: "Pass and shot. Sadly without an audience.",
      hints: ["No throw from here reaches the shelf with the switch, and the teal gate is just a low tunnel at floor level.", "Cubes can be carried. Even through tunnels someone else holds open.", "Your echo stands on the switch for the gate. Then carry the cube through the tunnel and throw it onto the shelf from inside."] },
    "Wachwechsel": { name: "Changing of the Guard", quip: "Shift change. One half of you is now off duty.",
      hints: ["The yellow door needs someone on the yellow switch, and the teal switch for the exit is beyond the flames.", "Your echo guards yellow, your cube guards teal. You guard nothing, you leave.", "Record yourself walking onto the yellow switch. Then carry the cube through the open door, across the flames, and put it on the teal switch."] },
    "Fallrohr": { name: "Drop Chute", quip: "Express delivery at top speed. Please stay out of the way.",
      hints: ["The cube is stuck in a cell you cannot pull it out of. It feels safe in there. For now.", "If the gun is aimed at a cube, Throw punts it away, even without grabbing. Whatever is punted through a portal keeps flying somewhere else.", "One portal on the back wall of the cell, one where the cube should come out. Then aim at the cube and punt it through the portal with Throw."] },
    "Freie Bahn": { name: "Clear Path", quip: "One cube, two jobs. Welcome to the economy.",
      hints: ["The laser should reach the receiver on the left, but the cube on the grille is in the way. The door also wants the switch.", "A cube that is in the way is a cube that is needed elsewhere.", "Grab the cube off the grille and put it on the switch. Then send the laser to the receiver on the left with a portal."] },
    "Doppelhalter": { name: "Double Hold", quip: "One sits in the pit, one throws. You know the drill.",
      hints: ["One switch is in a pit nobody gets out of, the other up on the shelf. You have one cube and one echo.", "The pit needs someone who does not have to come back. The shelf needs something that can be thrown.", "Record yourself jumping into the pit onto the switch. Then throw the cube onto the shelf."] },
    "Fernlieferung": { name: "Long-Distance Delivery", quip: "We do not deliver through walls. Through doors, we do.",
      hints: ["One switch is in a pit below the ledge, the other up high behind a door that only the pit switch opens. No throw reaches it from here.", "Your echo can take over the pit switch. Cubes fly through portals, and whatever falls fast into a floor comes fast out of a wall.", "Record yourself dropping into the pit onto the switch. Then grab the cube, put one portal on the white wall at the top left and one in the floor below, and throw it in. It flies through the open door onto the switch."] },
    "Doppelwurf": { name: "Double Throw", quip: "Double cubes, double joy. Joy is optional.",
      hints: ["Two cubes, two switches: one up on top of the ceiling, one in the cell behind the grille. Busywork with ambition.", "One cube goes up through the hole, the other goes in through two portals.", "Throw the first cube diagonally through the ceiling hole onto the upper switch. Then one portal under the ceiling, one on the cell's ceiling, and throw the second cube in."] },
    "Lichtsteg": { name: "Light Walk", quip: "Please do not jump onto light bridges with cargo. Fine, just this once.",
      hints: ["The bridge lies higher than the floor, and the switch is beyond it. You cannot push a cube up there.", "What cannot be pushed can be carried. You can also jump while carrying, by the way. Amazing, isn't it?", "Lay the bridge with a portal, grab the cube and jump onto the bridge with it. Up there, carry it across and put it on the switch."] },
    "Schildwache": { name: "Sentry", quip: "Your echo stands in the laser voluntarily. Voluntary is relative.",
      hints: ["A laser guards the way, and the switch is up on the shelf. You have one cube. It can either protect or switch.", "Your echo can carry the cube as a shield. And it withstands lasers, even after letting go of the cube.", "Hold the cube as a shield to the left and record yourself walking to the laser. Then throw the cube onto the shelf while your echo blocks the beam."] },
    "Schwerkraft": { name: "Gravity", quip: "Final chamber. We are almost a little moved. Almost.",
      hints: ["Finale. The cube is stuck in a cell, the switch is behind a laser curtain. Everything you have learned, plus a curtain.", "Punting works without grabbing, and a portal in the ceiling spits things out from above. A cube above your head is a roof.", "Punt the cube out of the cell through a portal that spits it out at the ceiling. Then carry it above your head through the laser curtain to the switch."] },
    "Sichtschutz": { name: "Line of Sight", quip: "Security protocol active. These devices protect the facility. From you.",
      hints: ["New: turrets. Whatever the red beam catches gets shot after a short charge. This one guards the way to the exit. Very conscientious.", "A cube blocks a turret's view. And a turret sees nothing behind itself. Like some department heads.", "Push the cube ahead of you toward the turret and drop down behind it. From behind, you are invisible."] },
    "Selbstgespräch": { name: "Self-Talk", quip: "This model is extremely self-critical. Use that.",
      hints: ["A turret guards the exit, and you cannot get past it. Two white surfaces happen to be nearby. Pure coincidence.", "Turrets shoot at everything they see. Truly everything. Including themselves, if you let them.", "One portal where it is looking, the other above its head. Then it looks down on itself and does the rest."] },
    "Gegenlicht": { name: "Backlight", quip: "Please do not look into the laser. That goes for turrets too. Especially for turrets.",
      hints: ["The turret guards the whole floor, and the laser up top shines into nothing. New for you: lasers burn out a turret's optics.", "Lasers can be redirected, downward too. A beam from above hits the head first.", "One portal on the left wall where the laser lands, the other on the ceiling above the turret. The beam drops onto its head, and the floor is clear."] },
    "Umzug": { name: "Relocation", quip: "Turrets know no collegiality. Neither do we.",
      hints: ["Down below, a turret guards the door to the exit, and the door only opens with weight on the switch up here. Next to you stands its colleague. Unemployed, for now.", "Two turrets that see each other shoot each other. Whatever is left afterwards still weighs enough for a switch.", "Carry the upper turret down and set it so it faces its colleague. Then bring one of the casualties back up onto the switch, carried or thrown."] },
    "Freiwilliger": { name: "Volunteer", quip: "We are looking for a volunteer. You just signed up.",
      hints: ["The switch is in the turret's line of sight, and there is no way back up from below. There is also a card floating above the switch.", "Your echo is immune to turrets and stays where the recording ends. A volunteer who cannot say no.", "Record yourself jumping onto the switch and stop the recording right away. Your echo stays put and grabs the card on the way."] },
    "Lockvogel": { name: "Decoy", quip: "Your echo is modelling. The turret is delighted.",
      hints: ["Up on the ledge, the turret's beam catches you. The exit, sadly, is right there.", "A beam needs a clear view. Your echo is not a clear view, it is an obstacle with your face.", "Record yourself jumping onto the pedestal and stop the recording quickly. Your echo blocks the beam, you walk to the exit."] },
    "Querschläger": { name: "Ricochet", quip: "Please introduce the two of them. It will be brief.",
      hints: ["Two turrets, two floors, one card at the very top right. There are no stairs up. Nor any nice way down.", "With two portals, the two turrets see each other. Afterwards the same portals make an elevator.", "One portal high on the right wall, one low on the left, and wait. Then walk into the portal at the bottom left, come out up top, grab the card and go back the same way."] },
    "Entsorgung": { name: "Disposal", quip: "Turrets are facility property. Please handle them with care. Or not.",
      hints: ["A turret guards the corridor, the door to the exit wants a switch, and a card lies behind the turret. There is no cube.", "From behind it cannot see you. And a turret weighs as much as a cube. We weighed it.", "Drop down behind the turret and pick up the card. Then grab it and carry it left onto the switch, facing right. It never sees you."] },
    "Kreuzfeuer": { name: "Crossfire", quip: "Two turrets, one door. We have provided popcorn.",
      hints: ["The door separates two turrets that must not see each other. Or maybe they should.", "When the door opens, the turrets see each other. You know what happens then. You just should not stand in between.", "Throw the cube onto the high switch and wait up top until it is quiet below. Then go down to the exit."] },
    "Trittstein": { name: "Stepping Stone", quip: "The spikes have been freshly sharpened. At your request.",
      hints: ["A spike pit, too wide to jump. We measured exactly. Twice.", "For cubes, spikes are just floor. For you they are a problem. For a cube underneath you, they are not.", "Throw the cube into the middle of the pit and hop across it."] },
    "Nadelkissen": { name: "Pincushion", quip: "Cubes are reusable. You, unfortunately, are not.",
      hints: ["Two spike pits, one cube. Sadly, the cube can only be in one place at a time.", "Whatever you threw, you can pull back from the other side. Recycling, so to speak.", "Throw the cube into the upper pit, hop across and pull it back from the far side. You need it again down below."] },
    "Einbahnstraße": { name: "One Way", quip: "You cannot be in two places at once. Actually, you can. Just not on time.",
      hints: ["The card lies in the left pit, the exit in the right one behind a door, and you cannot climb out of either pit. The switch for the door is up here.", "Your echo can do two things. Just not at the same time. Order is everything.", "Record this: first stand on the switch for a while, then go down into the left pit for the card. While your echo is still on the switch, jump down on the right yourself and walk through the door."] },
    "Podest": { name: "Pedestal", quip: "Turrets are not furniture. Nobody has told you yet, that is all.",
      hints: ["The exit is high on the left, with a pillar and a card in front of it. Both are too high for you. Not for a turret on spikes.", "A turret makes a decent step, and on spikes it stands even higher. And you can take it with you.", "Grab the turret from behind and set it on the right spike tile, facing the wall. Climb over it onto the pillar for the card. Then bring it along, set it on the left spike tile and climb over it to the exit."] },
    "Doppelkarte": { name: "Double Card", quip: "Double security. For us. Double work for you.",
      hints: ["Two cards: one in the cell behind the grille, one on the ledge at the top left. Sadly, you are standing on neither.", "One portal pair takes you into the cell and back out. And a white ceiling is an exit too, just a downward one.", "One portal low on the left wall, one on the right: in on the left, grab the card in the cell, back out on the right. Then move the right portal to the white ceiling at the top left and walk into the left one again. You drop onto the ledge from above."] },
    "Hochseil": { name: "High Wire", quip: "Balancing on light. We did not put up a net.",
      hints: ["The card lies at the bottom left beyond the live floor, the exit hangs high up on the left. The light bridge between them is at the wrong height for both.", "Light bridges continue through portals. So do you. Sometimes the best way up is a wall.", "One portal on the left where the bridge lands, one low on the left just above the live floor, and fetch the card. Then move the upper portal to the white wall at the top right and walk into the low portal. You come out up top and land on the bridge to the exit."] },
    "Isolator": { name: "Insulator", quip: "Rubber soles would have helped. We did not order any.",
      hints: ["The switch lies on the live floor, right in front of you. The door behind wants it pressed. You do not want to be grilled.", "Cubes do not conduct, you stand safely on them. But a cube cannot be a stepping stone and a weight at the same time.", "First throw the cube into the middle as a stepping stone and hop across it. From the far side, grab it and throw it back onto the switch."] },
    "Kartenhaus": { name: "House of Cards", quip: "Cards you carry during an accident are put back. Order must be maintained.",
      hints: ["The card floats above the spikes, the exit sits on the high ledge. You have one cube and one echo.", "Whatever your echo holds, it never lets go. So think about who gets what first.", "Fetch the card using the cube as a stepping stone over the spikes. Only then record your echo holding the cube as a step up to the ledge, and climb."] },
    "Erdung": { name: "Grounded", quip: "Your echo is grounded. Unlike you.",
      hints: ["Both switches lie on live floor. You must not stand there. Your echo may, it just cannot be recorded there.", "Your echo can take the current. It just has to end up on the floor somehow without you doing so.", "Put the cube on one switch and record yourself climbing onto it. Then pull it out from under your echo's feet and onto the other switch."] },
    "Prüfstand": { name: "Test Bench", quip: "Final exam for turrets. None has passed yet. You are the examiner.",
      hints: ["A turret guards the corridor, the cube is your only cover, and the door to the exit wants a switch. Which lies behind the turret. Naturally.", "The safest place is behind a turret. No path leads there across the spikes, but one leads through the floor. And a turret is also a weight.", "One portal in the floor beneath you, one on the white wall at the far right. You land on the turret. Put it on the switch facing the wall, jump back into the wall portal and walk through the open door."] },
    "Stromausfall": { name: "Power Failure", quip: "Power failure. Please remain calm. We can still see you, by the way.",
      hints: ["New: power failure. Without power it is dark and the exit is dead. Memorise the room while the emergency light flickers. We save energy here, not effort.", "The lever brings the power back. You flip it by walking into it. It hardly gets more user-friendly.", "Walk to the lever in the dark and into it. Then there is light, and the exit lives."] },
    "Dämmerung": { name: "Twilight", quip: "The turret is on call. It is asleep anyway. Like everyone here.",
      hints: ["Without power the turret sleeps. With power it does not. Sadly, the exit needs power.", "The lever stands right in front of the turret. Whoever switches on wakes it. Whoever still stands in front of it afterwards gets woken up. Permanently.", "Switch on and immediately get behind the turret or out of its view. Then on to the exit."] },
    "Fernschalter": { name: "Remote Switch", quip: "Remote control, house style: throwing.",
      hints: ["The light bridge needs power, and the lever is over there beyond the acid. A planning department classic.", "Levers don't only flip when you walk into them. Cubes count too. Cubes enjoy equal rights here.", "Grab the cube and throw it into the lever over there. Aim for the red light. Then across the bridge."] },
    "Kaltstart": { name: "Cold Start", quip: "Cold start successful. Please do not repeat. Actually, please do.",
      hints: ["Without power the floor is dead and harmless, but so is the exit. With power you can no longer get across. And over there the door needs weight on its switch. One cube, two jobs.", "A lever flips for anything that flies into it. Even for things that are supposed to shoot. While the power is off, the turret sleeps.", "Carry the cube across the dead floor and put it on the switch. Then grab the sleeping turret and throw it into the lever. It wakes up far away, with its back to you."] },
    "Schildbrücke": { name: "Shield Bridge", quip: "The bridge is safe. The turret is not. For you.",
      hints: ["The lever lies on your way, and the bridge comes with the power. So does the turret at the far end. It is a package deal.", "A held cube floats between you and whatever you aim at. Including between you and a turret.", "Grab the cube and hold it in front of you toward the turret. That way, walk through the lever and across the bridge to the exit."] },
    "Rückwurf": { name: "Return Throw", quip: "One cube, two throws. Efficiency is a form of laziness too. We admire it.",
      hints: ["Live floor lies between you and the exit. Without power it would be harmless, but without power the exit is dead too. The lever hangs out of reach above it.", "A cube flying into a lever flips it. And a cube you can find again can fly a second time.", "Throw the cube into the lever to cut the power and cross the dead floor. On the far side, grab the cube and throw it back into the lever. Then the exit is on again."] },
    "Schichtbeginn": { name: "Shift Start", quip: "Your shift starts when your echo says so.",
      hints: ["With power on, the turret gets you before you are past it. Without power, the exit is dead. The start of a shift is hard for everyone.", "Your echo can flip the lever later than you ever could. Punctuality is its strength.", "Record yourself waiting and then flipping the lever, and stop the recording at once. Set off in the dark. When the lights come on, you are already past."] },
    "Kurzschluss": { name: "Short Circuit", quip: "Short circuit in sector seven. No, that was you.",
      hints: ["A turret guards the light bridge, and without the bridge you won't reach the exit. Below the bridge, the floor crackles.", "Without power there is no bridge, and whatever stands on it falls. With power the floor below is deadly. For turrets too. Equal rights for all.", "Switch the power off so the turret falls off the vanished bridge. Switch it back on: the live floor finishes it off, and the bridge is clear."] },
    "Dunkelkammer": { name: "Darkroom", quip: "The darkroom. This is where we develop test subjects.",
      hints: ["In the dark you only see what is around you. Card and lever are on the far side, with pits in between. We did not forget the lights, we cut them.", "The emergency light flickers once at the start. That is not a fault, that is your only map.", "Memorise the pits during the flicker. Jump across in the dark, collect card and power, and come back to the exit in the light."] },
    "Blindflug": { name: "Flying Blind", quip: "Please aim in the dark. We believe in you. A little.",
      hints: ["The laser opens the door once it hits the receiver. With power on, the turret watches everything outside the alcove. Including you while you aim.", "Without power the turret sleeps, and portals can be placed in the dark too. We only monitor the electricity bill.", "Place the portals for the laser in the dark while the turret sleeps. Only then switch on and walk through the open door."] },
    "Kartenleger": { name: "Card Sharp", quip: "We hid the card well. In the laser. Very well.",
      hints: ["The card lies right in the laser beam. The laser needs power, and so does the exit. Who designed this? Ah yes, we did.", "What is deadly with power is merely dark without it. The lever hangs right above you.", "Jump into the lever to switch the power off and fetch the card in the dark. Back at the lever, switch on again and walk to the exit."] },
    "Fernwartung": { name: "Remote Maintenance", quip: "Remote maintenance. Your echo does the work, you turn on the lights.",
      hints: ["The switch over there opens the door to the exit, but the exit needs power. And with power on you cannot cross the floor.", "Your echo can take the current. But the walk can only be recorded while the floor is dead.", "In the dark, record yourself walking across the floor onto the switch. Then switch the power on. Your echo stands unimpressed on the switch, you go to the exit."] },
    "Hebelwirkung": { name: "Leverage", quip: "Leverage, physically correct. Almost.",
      hints: ["The lever sits in a cell behind bars, and the light bridge over the acid only comes with the power.", "A cube fits into the cell, through a portal. So do you, but you never get back out.", "Put a portal into the cell and let the cube drop through the other one into the small pit under the lever. Better not jump in after it. Then across the bridge."] },
    "Türstopper": { name: "Doorstop", quip: "Please keep the doors clear. Or not.",
      hints: ["With power on, the laser opens the door, but the turret is awake behind it. Without power it sleeps, and the door closes.", "You know this one: a door does not close while something stands in it. We did not fix that. On purpose.", "Switch on so the door opens, and put the cube in the doorway. Then switch off: the turret sleeps, the door stays open. Behind the turret, switch on again with the second lever."] },
    "Sichtachse": { name: "Line of Fire", quip: "Two turrets, one cube, zero trust.",
      hints: ["Below, two turrets guard the corridor, with the exit at one end and the card at the other. It is still dark. For now.", "Without power the turrets sleep. With power they shoot at everything they see, each other included. The cube is both stepping stone and blindfold, just not at the same time.", "In the dark, drop the cube through the right hole onto the spikes, go down the left one yourself and cross it to the card. Then grab the cube and hold it up so the turrets see each other, and flip the lever. Put the cube back on the spikes and cross to the exit."] },
    "Taktgeber": { name: "Metronome", quip: "Lights on, lights off, lights on. We call that precision work.",
      hints: ["You can only cross the acid with power, only get through the hole and past the turret without it, and only get out with it again. This is a timetable, not a room.", "Your echo can switch the lever off and on again for you, in exactly the rhythm you set.", "Record yourself switching the lever off and, after a while, on again. Then go: across the acid with power, through the hole in the dark, out with power."] },
    "Lichtschatten": { name: "Light and Shadow", quip: "Your echo stands in the light. You in the shadow. Very symbolic.",
      hints: ["There is a laser in the corridor below, and without power there is no exit. With power, though, there is no corridor.", "Your echo withstands lasers and casts a shadow. It just has to be standing there before the lights come on.", "In the dark, record yourself going down and standing right in front of the laser. Then switch on. Your echo catches the beam, you walk to the exit in its shadow."] },
    "Schattenmann": { name: "Shadow Man", quip: "Your echo leads, you follow. Teamwork at last.",
      hints: ["The turret stands right behind the exit and shoots the first thing it sees. We recommend not being the first thing.", "Your echo is immune and happy to go first. A shadow that walks ahead of you.", "In the dark, record yourself walking up to the turret. Then switch on and follow your echo closely to the exit."] },
    "Stromstoß": { name: "Power Surge", quip: "Turrets are not waterproof. Or much else, for that matter.",
      hints: ["The turret stands on a white plate in the low corridor, and you cannot get past it. Next to it, a pit crackles.", "Whatever stands on a floor portal falls through. Turrets too. And the live floor is just as unpleasant for turrets as it is for you.", "One portal under the turret's feet, the other above the live pit. Afterwards, better park the floor portal somewhere else before you walk over it yourself."] },
    "Umlenkung": { name: "Redirect", quip: "Multitasking is expressly discouraged in this facility. For lasers.",
      hints: ["One laser, one turret, one door with a receiver. We had to economise.", "The laser can do more than one job. Just not at the same time.", "First send the laser onto the turret. Once it is done, reset the portals and send the beam to the receiver that opens the door."] },
    "Abflug": { name: "Take-off", quip: "Please fasten your seatbelt. Oh, there are no belts. Never mind.",
      hints: ["The card floats high above the spikes, the exit sits on a ledge beside it. A breather. We are not monsters.", "What falls deep flies high. You have known that since the second chamber.", "One portal at the bottom of the pit, one in the white patch between the spikes. Drop in, fly through the card and steer to the exit after take-off."] },
    "Lichtwechsel": { name: "Changeover", quip: "Power on, power off. You now have authority over the light switches. Please do not abuse it.",

  const v = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
  let best = null, bs = Infinity;
  for (const el of items) {
    if (el === cur) continue;
    const q = el.getBoundingClientRect(), dx = q.left + q.width / 2 - cx, dy = q.top + q.height / 2 - cy;
    const along = dx * v[0] + dy * v[1]; if (along <= 4) continue;
    const across = Math.abs(dx * v[1] - dy * v[0]), sc = along + across * 2.2;
    if (sc < bs) { bs = sc; best = el; }
  }

}
function padBack() {
  if (ironLocked()) return;
  if (panel === 'pause' || !padFrom) { padFrom = null; setPanel(null); return; }
  padFrom = null; setPanel('pause'); padFocus(padItems()[0]);
}
function openPause() { padFrom = null; setPanel('pause'); padFocus(padItems()[0]); Snd.button && Snd.button(true); }
function pollPad() {
  let gp = null;
  try { const list = navigator.getGamepads ? navigator.getGamepads() : []; for (const g of list) if (g && g.connected) { gp = g; break; } } catch (_) {}
  $('padnote').hidden = !gp;
  if (!gp) { input.padAxis = 0; held.pad = false; padPrev = []; return; }
  const b = i => !!(gp.buttons[i] && (gp.buttons[i].pressed || gp.buttons[i].value > 0.5));
  const edge = i => b(i) && !padPrev[i];
  const done = () => { padPrev = gp.buttons.map(x => !!(x && (x.pressed || x.value > 0.5))); };
  const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
  // the first real input from a controller switches to the controller layout
  if (!padMode && (gp.buttons.some((_, i) => edge(i)) || Math.abs(ax) > 0.6 || Math.abs(ay) > 0.6)) setPadMode(true);
  if (cine) { if (gp.buttons.some((_, i) => edge(i))) cineInput(); done(); input.padAxis = 0; return; }
  if (panel) { // menu navigation
    input.padAxis = 0; held.pad = true;
    const dir = b(12) || ay < -0.6 ? 'up' : b(13) || ay > 0.6 ? 'down' : b(14) || ax < -0.6 ? 'left' : b(15) || ax > 0.6 ? 'right' : null;
    const now = performance.now();
    if (dir !== padRep.dir) { padRep.dir = dir; padRep.t = now + 380; if (dir) padMove(dir); }
    else if (dir && now >= padRep.t) { padRep.t = now + 110; padMove(dir); }
    if (edge(0)) { const cur = padCurrent(); if (cur) { if (cur.tagName === 'SELECT') { cur.selectedIndex = (cur.selectedIndex + 1) % cur.options.length; cur.dispatchEvent(new Event('change', { bubbles: true })); } else if (cur.type !== 'range') cur.click(); } else padFocus(padItems()[0]); }
    else if (edge(1)) padBack();
    else if (edge(9)) { if (!ironLocked()) { padFrom = null; setPanel(null); } }
    done(); return;
  }
  padRep.dir = null;
  if (edge(9)) { if (state === 'done') loadLevel(0); else openPause(); done(); return; }
  if (edge(8)) restartChamber();
  const dpad = (b(15) ? 1 : 0) - (b(14) ? 1 : 0);
  input.padAxis = Math.abs(ax) > 0.22 ? ax : dpad;
  const jumpBtn = b(0) || b(4); // A, or LB so the right thumb can stay on the aim stick
  if (jumpBtn && !held.pad) pressJump();
  held.pad = jumpBtn;
  const rx = gp.axes[2] || 0, ry = gp.axes[3] || 0, rl = Math.hypot(rx, ry);
  if (rl > 0.35) { aim.dx = rx / rl; aim.dy = ry / rl; aim.mode = 'stick'; aim.mouse = false; }
  if (edge(6)) { if (aim.mode === 'none') aim.mode = 'stick'; syncAim(); fire('blue', aim.x, aim.y); }
  if (edge(7)) { if (aim.mode === 'none') aim.mode = 'stick'; syncAim(); fire('orange', aim.x, aim.y); }
  if (edge(3)) toggleEcho();
  if (edge(2)) gravGrab(player);
  if (edge(5)) { if (player.held) gravThrow(player); else gravGrab(player); } // RB: grab, or throw what you hold
  if (edge(1)) gravThrow(player);
  done();
}

// language dropdown, filled from LANGS so a new language only needs its text blocks
{ const sel = $('langSel');
