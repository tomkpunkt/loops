<title>Loops</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1217">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one test-chamber screen, HUD strip above, controls strip below. Deliberately single dark theme (game screen). */
:root{
  --bg:#0d1217; --panel:#151c23; --line:#25303b; --fg:#e3e9ee; --muted:#8796a4;
  --blue:#3b9cff; --orange:#ff8c2a; --ok:#7be08a;
  --display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font-family:var(--mono); font-size:14px; overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:max(8px,env(safe-area-inset-top,0px)); padding-bottom:max(8px,env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%; touch-action:manipulation;
}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:8px;min-height:calc(100dvh - max(8px,env(safe-area-inset-top,0px)) - max(8px,env(safe-area-inset-bottom,0px)))}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.hud .chamber{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--blue)} .brand h1 span+span{color:var(--orange)}
.brand .sub{color:var(--muted);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
.right{display:flex;align-items:center;gap:8px;flex:none}
.dots{display:flex;gap:6px}
.dots button,.btn{
  font:500 .8rem var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:6px 10px;cursor:pointer;letter-spacing:.04em;
}
.dots button{width:34px;padding:6px 0;font-variant-numeric:tabular-nums}
.dots button[aria-current="true"]{border-color:var(--fg)}
.dots button:disabled{opacity:.35;cursor:not-allowed}
.btn:hover,.dots button:not(:disabled):hover{border-color:var(--muted)}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.stage{position:relative;border:0;border-radius:8px;overflow:hidden;background:#0a0f13;width:100%;max-width:100%;margin-inline:auto;--amb:59,156,255;--ambA:.16;}
canvas{display:block;width:100%;height:auto;max-width:100%;touch-action:none;cursor:none}
.help{position:absolute;inset:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);overflow:auto;padding:18px max(16px,4%)}
.helpbody{display:flex;flex-direction:column;gap:12px;max-width:62ch;margin:0 auto}
.help h2{margin:0;font-family:var(--display);font-weight:700;font-size:1.1rem;letter-spacing:.08em;text-transform:uppercase}
.help h2 span{color:var(--blue)} .help h2 span+span{color:var(--orange)}
.help h3{margin:4px 0 0;font:500 .7rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.langs{display:flex;gap:8px;flex-wrap:wrap}
.sel{font:500 .85rem var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:12em;max-width:100%}
.sel:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.settings{display:grid;gap:8px;max-width:340px}
.dbgtable{font:500 .72rem var(--mono);color:var(--muted);max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.dbgtable table{border-collapse:collapse;width:100%}
.dbgtable td,.dbgtable th{padding:3px 8px;text-align:right;white-space:nowrap}
.dbgtable th{color:var(--fg);position:sticky;top:0;background:var(--panel)}
.dbgtable td:first-child,.dbgtable th:first-child{text-align:left;max-width:9.5em;overflow:hidden;text-overflow:ellipsis}
.dbgtable td,.dbgtable th{padding:3px 6px}
.settings label{display:grid;grid-template-columns:7.5em 1fr;align-items:center;gap:10px;font-size:.78rem;color:var(--fg)}
.settings label.chk{grid-template-columns:auto 1fr}
.settings input[type=range]{width:100%;accent-color:var(--blue);min-height:28px}
.settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue)}
.langs .btn{padding:6px 12px}
.langs .btn[aria-pressed="true"]{border-color:var(--blue);color:var(--fg);background:color-mix(in srgb,var(--blue) 18%,var(--panel))}
body:not(.debug) .dbgnav{display:none!important}
.debug #cnum::after{content:' · DEBUG';color:#ff6a5a}
.help .close{align-self:flex-start;margin-top:4px}
.iconbtn[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.iconbtn{width:38px;height:34px;padding:0;font:700 1rem var(--display);display:inline-grid;place-items:center}
.chamber{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}
.chamber small{color:var(--muted);font-weight:500;font-family:var(--mono);letter-spacing:.06em;margin-right:8px}
.hint{color:var(--fg);margin:0;line-height:1.55;min-width:0}
.hints{display:grid;gap:8px;min-width:0}
.hints .hint small{display:block;color:var(--muted);font:500 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.hints .locked{color:var(--muted);font-style:italic;font-size:.82rem}
#helpBtn.new{border-color:var(--orange,#ff9a3c);color:var(--orange,#ff9a3c);animation:hintPulse 1.4s ease-in-out infinite}
@keyframes hintPulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,#ff9a3c 35%,transparent)}}
@media (prefers-reduced-motion:reduce){#helpBtn.new{animation:none}}
.keys{color:var(--muted);font-size:.78rem;line-height:1.8;margin:0}
kbd{font:500 .74rem var(--mono);color:var(--fg);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--panel)}
.ctrl{display:none;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;padding-block:2px 18px}
.stick{--sz:clamp(92px,27vw,150px);width:var(--sz);height:var(--sz);border-radius:50%;position:relative;touch-action:none;
  background:radial-gradient(circle at 50% 50%,#1b242d 0 38%,#151c23 39% 100%);border:1px solid var(--line);box-shadow:inset 0 0 0 6px #121920}
.stick::before{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed #2c3946}
.stick .knob{position:absolute;left:50%;top:50%;width:44%;height:44%;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#3a4a5a,#24303c);border:1px solid #47596b;box-shadow:0 4px 10px rgba(0,0,0,.45);
  transition:transform .12s ease-out;pointer-events:none}
.stick.held .knob{transition:none;background:radial-gradient(circle at 40% 35%,#4a5d70,#2c3a48)}
.stick .tag{position:absolute;left:0;right:0;bottom:-18px;text-align:center;font:500 .66rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.stick.jump::after{content:"";position:absolute;inset:4%;border-radius:50%;pointer-events:none;background:conic-gradient(from -45deg,rgba(150,200,240,.2) 0 90deg,transparent 90deg 360deg);-webkit-mask:radial-gradient(circle,transparent 52%,#000 53%);mask:radial-gradient(circle,transparent 52%,#000 53%);transition:background .12s}
.stick.jump.up::after{background:conic-gradient(from -45deg,rgba(150,210,255,.5) 0 90deg,transparent 90deg 360deg)}
.stick.aim{box-shadow:inset 0 0 0 6px #121920,0 0 0 1px color-mix(in srgb,var(--blue) 40%,transparent),0 0 0 1px color-mix(in srgb,var(--orange) 40%,transparent)}
.stick.aim::before{border-color:#3a3f52}
.mid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:220px;width:100%;justify-self:center}
.mid button{touch-action:none;font:700 .8rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);
  background:var(--panel);border:1px solid var(--line);border-radius:12px;height:52px;min-width:0;padding:0}
.mid .fb{border-color:color-mix(in srgb,var(--blue) 55%,var(--line));background:color-mix(in srgb,var(--blue) 14%,var(--panel))}
.mid .fo{border-color:color-mix(in srgb,var(--orange) 55%,var(--line));background:color-mix(in srgb,var(--orange) 14%,var(--panel))}
.mid .jb{grid-column:1 / -1;height:64px;font-size:.95rem;border-color:#3a4a5a;background:#1c2630}
.mid .eb{grid-column:1 / -1;height:40px;font-size:.78rem;border-color:#5a4a8a;background:#221c33;color:#d9ccff}
.mid .gb{height:44px;font-size:.78rem;border-color:#8a6a2a;background:#2a2214;color:#ffd9a0}
.mid button{display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.mid button[hidden]{display:none}
.mid .ic{width:32px;height:32px;flex:none;pointer-events:none}
.mid .jb .ic,.mid .eb .ic{width:22px;height:22px}
.mid button span{pointer-events:none;white-space:nowrap}
.mid .fb{color:var(--blue)} .mid .fo{color:var(--orange)}
.mid .fb .ic,.mid .fo .ic{filter:drop-shadow(0 0 5px currentColor);width:38px;height:38px}
.mid button.held{filter:brightness(1.5);transform:translateY(1px)}
.taphint{display:none;color:var(--muted);font-size:.78rem;margin:0;line-height:1.5}
.dots{flex-wrap:wrap}
.padnote{color:var(--muted);font-size:.78rem;margin:0}
@media (hover:none) and (pointer:coarse){
  .ctrl{display:grid;margin-top:auto} .taphint{display:block}
  .mid{max-width:240px}
  .ctrl{gap:10px} .keys{display:none} canvas{cursor:default}
  .brand .sub{display:none}
}
/* phone in landscape: sticks left and right of the chamber */
@media (hover:none) and (pointer:coarse) and (orientation:landscape) and (max-height:560px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:14px;row-gap:6px;max-width:none;min-height:calc(100dvh - 16px)}
  .hud{grid-column:1 / -1;grid-row:1}
  .stage{grid-column:2;grid-row:2 / 4;align-self:start}
  .ctrl{display:contents}
  #moveStick{grid-column:1;grid-row:3;justify-self:center;align-self:end;margin-bottom:22px}
  #aimStick{grid-column:3;grid-row:3;justify-self:center;align-self:end;margin-bottom:22px}
  .mid{grid-column:3;grid-row:2;align-self:center;justify-self:center;width:min(220px,100%)}
  .stick{--sz:clamp(96px,32vh,140px)}
}
/* controller mode: chamber fills the screen, touch controls and HUD strip hidden */
body.pad{padding:0;margin:0;background:#000;overflow:hidden}
body.pad .wrap{display:flex!important;max-width:none;gap:0;min-height:100dvh;height:100dvh;justify-content:center;align-items:center}
body.pad .hud,body.pad .ctrl,body.pad .taphint,body.pad .keys{display:none!important}
body.pad .stage{border-radius:0;grid-column:auto;grid-row:auto}
body.pad canvas{cursor:none}
.padfocus{outline:2px solid var(--orange)!important;outline-offset:3px}
.pmenu{display:grid;gap:8px;max-width:320px}
.pmenu .btn{text-align:left;padding:10px 14px;font-size:.9rem}
.padkeys{color:var(--muted);font-size:.75rem;margin:0}
.ironnote{display:none;color:var(--muted);margin:0}
body.iron #hint,body.iron #dots,body.iron [data-t=hHint],body.iron [data-t=hChambers]{display:none}
body.iron .ironnote{display:block}
.ironinfo{color:var(--fg);font-size:.8rem;line-height:1.55;margin:0;max-width:56ch}
.ironinfo small{display:block;color:var(--muted);margin-top:4px}
.ironres{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:.9rem;max-width:300px}
.ironres span:nth-child(odd){color:var(--muted)}
.ironres b{font-family:var(--display);font-size:1rem}
</style>

<div class="wrap">
  <header class="hud">
    <div class="chamber"><small id="cnum"></small><span id="cname"></span></div>
    <div class="right">
      <button class="btn iconbtn dbgnav" id="dbgPrev" type="button" data-aria="aPrev">‹</button>
      <button class="btn iconbtn dbgnav" id="dbgNext" type="button" data-aria="aNext">›</button>
      <button class="btn iconbtn" id="helpBtn" type="button" data-aria="aHelp" aria-expanded="false">?</button>
      <button class="btn iconbtn" id="optsBtn" type="button" data-aria="aOpts" aria-expanded="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button class="btn iconbtn" id="restart" type="button" data-aria="aRestart">↻</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="game" tabindex="0" data-aria="aCanvas"></canvas>
    <div class="help" id="help" hidden>
      <div class="helpbody">
        <h2>L<span>O</span><span>O</span>PS</h2>
        <p class="ironnote" data-t="ironNote"></p>
        <h3 data-t="hHint"></h3>
        <div class="hints" id="hint"></div>
        <h3 data-t="hChambers"></h3>
        <div class="dots" id="dots" data-aria="aDots"></div>
        <div id="dbgStats" hidden>
          <h3 data-t="dbgTitle"></h3>
          <div class="dbgtable" id="dbgTable"></div>
          <div class="langs"><button class="btn" type="button" id="dbgCopy" data-t="dbgCopy"></button><button class="btn" type="button" id="dbgReset" data-t="dbgReset"></button></div>
        </div>
        <h3 data-t="hControls"></h3>
        <p class="keys" data-t-html="keys"></p>
        <p class="taphint"></p>
        <p class="padnote" id="padnote" data-t="padnote" hidden></p>
        <button class="btn close" id="helpClose" type="button" data-t="resume"></button>
      </div>
    </div>
    <div class="help" id="pause" hidden>
      <div class="helpbody">
        <h2>L<span>O</span><span>O</span>PS</h2>
        <h3 data-t="hPause"></h3>
        <div class="pmenu">
          <button class="btn" type="button" id="pResume" data-t="resume"></button>
          <button class="btn" type="button" id="pRestart" data-t="pRestart"></button>
          <button class="btn" type="button" id="pGiveUp" data-t="ironGiveUp" hidden></button>
          <button class="btn" type="button" id="pHelp" data-t="pHelp"></button>
          <button class="btn" type="button" id="pOpts" data-t="hOpts"></button>
          <button class="btn" type="button" id="pFull" data-t="pFull"></button>
          <button class="btn" type="button" id="pQuit" data-t="pQuit" hidden></button>
        </div>
        <p class="padkeys" data-t="padMenuKeys"></p>
      </div>
    </div>
    <div class="help" id="ironfail" hidden>
      <div class="helpbody">
        <h2 data-t="ironFailT"></h2>
        <p class="ironinfo" data-t="ironFailP"></p>
        <div class="pmenu">
          <button class="btn" type="button" id="ironSkipBtn" data-t="ironSkip"></button>
          <button class="btn" type="button" id="ironRestartBtn" data-t="ironRestart"></button>
        </div>
      </div>
    </div>
    <div class="help" id="ironres" hidden>
      <div class="helpbody">
        <h2 data-t="ironResT"></h2>
        <div class="ironres" id="ironResBox"></div>
        <p class="ironinfo" id="ironResQuip"></p>
        <div class="pmenu">
          <button class="btn" type="button" id="ironAgainBtn" data-t="ironAgain"></button>
          <button class="btn" type="button" id="ironBackBtn" data-t="ironBack"></button>
        </div>
      </div>
    </div>
    <div class="help" id="opts" hidden>
      <div class="helpbody">
        <h2 data-t="hOpts"></h2>
        <h3 data-t="hSettings"></h3>
        <div class="settings">
          <label><span data-t="sMusic"></span><input type="range" min="0" max="1" step="0.05" data-vol="music"></label>
          <label><span data-t="sSfx"></span><input type="range" min="0" max="1" step="0.05" data-vol="sfx"></label>
          <label><span data-t="sVoice"></span><input type="range" min="0" max="1" step="0.05" data-vol="voice"></label>
          <label class="chk"><input type="checkbox" id="jumpChk"><span data-t="sStickJump"></span></label>
          <label class="chk"><input type="checkbox" id="lightChk"><span data-t="sLight"></span></label>
          <label class="chk"><input type="checkbox" id="calmChk"><span data-t="sCalm"></span></label>
        </div>
        <h3 data-t="hIron"></h3>
        <p class="ironinfo" id="ironInfo"></p>
        <div class="langs"><button class="btn" type="button" id="ironStartBtn" data-t="ironStart"></button><button class="btn" type="button" id="ironGiveBtn" data-t="ironGiveUp" hidden></button><button class="btn" type="button" id="ironQuitBtn" data-t="ironQuit" hidden></button></div>
        <h3 data-t="hLang"></h3>
        <select class="sel" id="langSel" data-aria="hLang"></select>
        <button class="btn close" id="optsClose" type="button" data-t="resume"></button>
      </div>
    </div>
  </div>

  <div class="ctrl" id="ctrl">
    <div class="stick" id="moveStick" role="group" data-aria="move"><div class="knob"></div><span class="tag" data-t="move"></span></div>
    <div class="mid">
      <button type="button" class="fb" data-fire="blue" data-aria="blue"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="5.2" ry="9.5" fill="none" stroke="currentColor" stroke-width="2.6"/><ellipse cx="12" cy="12" rx="2.2" ry="6" fill="currentColor" opacity=".35"/><circle cx="19.5" cy="6" r="1.1" fill="currentColor"/><circle cx="20.5" cy="12.5" r=".9" fill="currentColor" opacity=".7"/><circle cx="4" cy="17" r="1" fill="currentColor" opacity=".7"/></svg></button>
      <button type="button" class="fo" data-fire="orange" data-aria="orange"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="5.2" ry="9.5" fill="none" stroke="currentColor" stroke-width="2.6"/><ellipse cx="12" cy="12" rx="2.2" ry="6" fill="currentColor" opacity=".35"/><circle cx="19.5" cy="6" r="1.1" fill="currentColor"/><circle cx="20.5" cy="12.5" r=".9" fill="currentColor" opacity=".7"/><circle cx="4" cy="17" r="1" fill="currentColor" opacity=".7"/></svg></button>
      <button type="button" class="jb" data-act="jump" data-aria="jump"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l6-6 6 6"/><path d="M8 17l4-4 4 4" opacity=".55"/><path d="M5 21h14" opacity=".4"/></svg><span data-t="jump"></span></button>
      <button type="button" class="eb" id="echoBtn" data-aria="echo" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4 3.5v4h4"/><path d="M12 8v4.5l3 2"/></svg><span data-t="echo"></span></button>
      <button type="button" class="gb" id="grabBtn" data-aria="grab" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="currentColor" fill-opacity=".3"/><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/></svg></button>

      env.gain.setValueAtTime(0.0001, t);
      env.gain.linearRampToValueAtTime(vol, t + atk);
      env.gain.setValueAtTime(vol, end - rel);
      env.gain.linearRampToValueAtTime(0.0001, end);
      src.start(t); br.start(t, Math.random()); src.stop(end + 0.02); br.stop(end + 0.02);
    },
  };
})();

const LEVEL_TXT = {
  de: {
    "Erster Schritt": { name: "Erster Schritt", quip: "Willkommen zurück. Das Gefühl, an zwei Orten gleichzeitig zu sein, ist normal.",
      hints: ["Der Ausgang liegt auf dem Sims, und Ihre Beine reichen dafür nicht. Neu: die Portalkanone. Weiße Flächen nehmen Portale an, alles andere nimmt nur Schaden.", "Ein Portal an die weiße Wand neben Ihnen, eins an die weiße Wand beim Sims. Zwei Löcher, ein Raum. Physik kann so entgegenkommend sein.", "Blau an die Wand links unten, Orange an die Wand rechts neben dem Ausgang. Dann einfach hineinlaufen. Ja, so einfach. Wir sind auch enttäuscht."] },
    "Schwung": { name: "Schwung", quip: "Schwung ist kostenlos. Stacheln leider auch.",
      hints: ["Zwischen Ihnen und dem Ausgang liegen Stacheln. Neu: Stacheln sind für Sie tödlich. Für alles andere sind sie nur Dekoration.", "Was tief fällt, kommt schnell wieder heraus. Die Höhe Ihres Simses ist kein Hindernis, sondern Kapital.", "Ein Portal in den Boden unter dem Sims, eins an die linke Wand. Rechts vom Sims hinunterfallen und mit Schwung über die Stacheln wieder heraus."] },
    "Würfel": { name: "Würfel", quip: "Der Würfel hat keine Gefühle. Wir haben nachgesehen.",
      hints: ["Der Schalter will einen Würfel, und der Würfel liegt auf der falschen Seite des Gitters. Sie übrigens auch.", "Durch das Gitter kommen weder Sie noch Würfel. Portalschüsse dagegen schon. Wir haben das Gitter nicht für Sie gebaut.", "Ein Portal auf den Boden bei Ihnen, eins auf den Boden hinter dem Gitter. Erst den Würfel hineinschieben, dann selbst folgen und den Würfel auf den Schalter stellen."] },
    "Schleife": { name: "Schleife", quip: "Endlosschleifen sind in dieser Anlage ausdrücklich erlaubt.",
      hints: ["Der Ausgang liegt oben rechts, Sie stehen unten links. Laufen wird hier nichts. Neu: das grüne Becken ist Säure. Hinein geht alles, heraus nichts.", "Boden und Decke, mit Portalen verbunden, ergeben eine Endlosschleife. Mit jeder Runde werden Sie schneller. Nicht klüger, aber schneller.", "Blau in den Boden, Orange an die Decke darüber. Während Sie fallen, Orange an die linke Wand umsetzen. Ihr Schwung trägt Sie dann nach rechts zum Ausgang."] },
    "Sprungbrett": { name: "Sprungbrett", quip: "Was hineinfällt, kommt heraus. Physik ist da sehr konsequent.",
      hints: ["Die Säule mit dem Ausgang steht hinter dem Gitter. Hinüberspringen ist zwecklos, wir haben nachgemessen.", "Was in einen Boden fällt, kommt aus einem anderen Boden genauso schnell wieder heraus. Auch nach oben.", "Ein Portal unter dem Sims in den Boden, eins in den Boden hinter dem Gitter. Vom Sims hineinfallen, hochschleudern lassen und in der Luft auf die Säule lenken."] },
    "Zwei Schalter": { name: "Zwei Schalter", quip: "Zwei Schalter. Wir haben uns nicht verzählt.",
      hints: ["Zwei Schalter, eine Tür, und nur ein Würfel liegt griffbereit. Der zweite hat sich unter dem Gitter versteckt. Schüchtern.", "Von oben können Sie durch das Gitter schießen. Was unten ein Portal unter sich hat, fällt woanders wieder heraus.", "Stellen Sie sich über das Gitter und schießen Sie ein Portal auf den Boden unter dem versteckten Würfel, das andere an die weiße Wand links. Dann beide Würfel auf die Schalter."] },
    "Würfelwurf": { name: "Würfelwurf", quip: "Werfen Sie bitte den Würfel. Nicht sich selbst.",
      hints: ["Der Schalter liegt auf einer Insel hinter der Säure, der Würfel auf einem Sims, das Sie nicht erreichen. Ein Nachmittag voller Möglichkeiten.", "Portale tragen auch Würfel. Was schnell aus einer Wand kommt, fliegt weit.", "Klettern Sie per Bodenportal und Wandportal auf das Sims. Schubsen Sie den Würfel hinunter in ein Bodenportal und lassen Sie ihn aus der linken Wand über die Säure fliegen."] },
    "Aufzug": { name: "Aufzug", quip: "Der Aufzug ist defekt. Sie sind jetzt der Aufzug.",
      hints: ["Das obere Sims ist sehr hoch. Ihr Sprung ist sehr niedrig. Das ist keine Kritik, nur eine Feststellung.", "Eine Schleife zwischen Boden und Decke macht Sie schnell. Schnell kann man auch nach oben sein.", "Boden und Decke verbinden und fallen, bis Sie Tempo haben. Dann das Deckenportal auf den Boden rechts umsetzen und sich zum oberen Sims hinaufschießen lassen."] },
    "Lichtweg": { name: "Lichtweg", quip: "Lasertests. Bitte nicht in den Strahl blicken. Oder hineinlaufen.",
      hints: ["Der Empfänger rechts möchte Licht. Der Laser zielt leider auf den Boden. Wie so vieles hier.", "Laser töten, Portale leiten sie um. Was ein Bodenportal schluckt, spuckt das andere Portal wieder aus.", "Ein Portal in den Boden, wo der Strahl auftrifft, das andere an die linke Wand auf Höhe des Empfängers. Und dann bitte nicht durch den Strahl laufen."] },
    "Doppelschicht": { name: "Doppelschicht", quip: "Zwei Aufgaben, zwei Portale. Teilen Sie sich das gut ein.",
      hints: ["Die Tür will Schalter und Empfänger, und Sie haben genau zwei Portale. Mathematisch reicht das. Emotional vielleicht nicht.", "Zwei Aufgaben, ein Portalpaar: eins nach dem anderen. Würfel bleiben liegen, wo Sie sie hinstellen. Portale nicht.", "Erst den Würfel mit den Portalen aus der Grube holen und auf den Schalter stellen. Dann dieselben Portale neu setzen und den Laser zum Empfänger leiten."] },
    "Brückenschlag": { name: "Brückenschlag", quip: "Diese Brücke besteht aus Licht. Sie können darauf laufen. Bitte nicht darüber nachdenken.",
      hints: ["Neu: Flammen. Was hineinfällt, kommt nicht wieder heraus. Der Projektor links baut eine Lichtbrücke, nur leider ins Leere.", "Lichtbrücken laufen, bis sie auf eine Wand treffen. Oder auf ein Portal. Dann laufen sie einfach woanders weiter.", "Ein Portal dorthin, wo die Brücke auf die Wand trifft, das andere an die linke Wand knapp über den Flammen. Dann mit heilen Schuhsohlen zum Ausgang."] },
    "Schutzschild": { name: "Schutzschild", quip: "Licht gegen Licht. Wir wetten intern auf das Ergebnis.",
      hints: ["Der Laser von der Decke versperrt den Weg. Ausweichen ist nicht vorgesehen.", "Lichtbrücken halten Laser auf. Eine Brücke über Ihrem Kopf ist ein Dach.", "Leiten Sie die Brücke mit zwei Portalen durch den schwebenden Block, sodass sie den Strahl über Ihrem Kopf abfängt. Die rechte Seite des Blocks treffen Sie nur von rechts."] },
    "Überfahrt": { name: "Überfahrt", quip: "Fracht und Testperson auf derselben Brücke. Was soll schon passieren.",
      hints: ["Der Schalter liegt hinter der Säure, der Würfel davor. Schwimmen können beide nicht.", "Lichtbrücken tragen auch Würfel. Geschoben fährt ein Würfel erstaunlich gern Brücke.", "Legen Sie die Brücke per Portal aus der linken Wand knapp über den Boden. Dann den Würfel über die Säure auf den Schalter schieben und hinterhergehen."] },
    "Deckung": { name: "Deckung", quip: "Der Boden ist heute leider nicht begehbar. Improvisieren Sie.",
      hints: ["Der Laser fegt über den ganzen Boden. Den ganzen. Wir waren gründlich.", "Ein Würfel im Strahl wirft einen Schatten. Im Schatten lebt es sich länger.", "Schieben Sie den Würfel vom Sims in den Strahl und landen Sie direkt hinter ihm. Dann im Schatten weiter zum Ausgang."] },
    "Lichtschranke": { name: "Lichtschranke", quip: "Zwei Strahlen, ein Portal. Effizienz ist unsere Kernkompetenz.",
      hints: ["Laser und Brücke treffen denselben Block. Sie treffen hoffentlich den Ausgang.", "Ein Portalpaar leitet alles um, was hineingeht. Auch zwei Dinge auf einmal. Effizienz, ganz ohne Ihr Zutun.", "Ein Portal auf den Block, den Laser und Brücke treffen, das andere unten an die linke Wand. Auf der Brücke den Kopf einziehen, der Strahl läuft knapp darüber."] },
    "Finale": { name: "Finale", quip: "Letzte Kammer. Wir haben eine Abschlussfeier geplant. Theoretisch.",
      hints: ["Die Tür will Schalter und Empfänger, und zwischen Ihnen und beidem liegt Säure. Ein Finale. Wir haben uns Mühe gegeben.", "Erst die Brücke, dann der Laser. Ein Portalpaar, zwei Einsätze, und Würfel fahren gern Brücke.", "Legen Sie die Brücke per Portal über die Säure und schieben Sie den Würfel auf den Schalter. Dann vom anderen Ufer aus die Portale neu setzen und den Laser zum Empfänger leiten."] },
    "Echo": { name: "Echo", quip: "Sie sind schon wieder da. Und auch schon wieder.",
      hints: ["Neu: Echo. Drücken Sie „Echo“ ({echoKey}), gehen Sie zum Schalter und drücken Sie noch einmal. Die Zeit springt zurück, und Ihr Echo wiederholt alles, was Sie getan haben.", "Ihr Echo bleibt am Ende seiner Aufnahme stehen. Ein Echo auf einem Schalter ist ein Schalter, der gedrückt bleibt. Eine geniale Erfindung, falls Sie fragen.", "Aufnahme starten, auf den Schalter stellen, Aufnahme beenden. Während Ihr Echo dort wartet, gehen Sie selbst durch die offene Tür."] },
    "Zweite Schicht": { name: "Zweite Schicht", quip: "Teamarbeit mit sich selbst. Die Personalabteilung ist begeistert.",
      hints: ["Ein Schalter liegt oben auf dem Sims, einer unten. Sie sind nur einer. Noch.", "Ihr Echo kann Portale schießen und benutzen, genau wie Sie. Es macht nur weniger Fehler, weil es Ihre schon kennt.", "Nehmen Sie den Weg per Portal hinauf auf den oberen Schalter auf. Danach kümmern Sie sich selbst um den Würfel für den unteren."] },
    "Stellvertreter": { name: "Stellvertreter", quip: "Einer muss ja die Stellung halten. Diesmal nicht Sie.",
      hints: ["Der Schalter liegt in einer versiegelten Zelle. Wer dort steht, kommt nicht mehr zur Tür.", "Es gibt zwei von Ihnen. Einer davon ist entbehrlich. Raten Sie, welcher.", "Nehmen Sie auf, wie Sie per Portal hinter das Gitter auf den Schalter gelangen. Aufnahme beenden, dann gehen Sie selbst durch die Tür."] },
    "Arbeitsteilung": { name: "Arbeitsteilung", quip: "Arbeitsteilung: Einer sitzt im Loch, einer arbeitet. Klassisch.",
      hints: ["Aus der Grube unten rechts sehen Sie keine weiße Fläche, und heraus kommen Sie auch nicht. Die Tür will trotzdem Schalter und Empfänger.", "Einer muss auf den Schalter, einer muss den Laser umleiten. Delegieren Sie die langweilige Hälfte.", "Nehmen Sie auf, wie Sie zum Schalter gehen, und beenden Sie die Aufnahme dort. Dann setzen Sie selbst die Portale und leiten den Laser zum Empfänger."] },
    "Turmbau": { name: "Turmbau", quip: "Bitte stellen Sie sich auf sich selbst. Das ist kein Tippfehler.",
      hints: ["Das Sims ist drei Felder hoch. Ihr Sprung schafft zwei. Das fehlende Feld sind Sie.", "Ein Echo ist fest genug, um darauf zu stehen. Ein Würfel auch. Übereinander ist beides höher.", "Würfel an die Wand schieben, aufnehmen, wie Sie auf ihn springen, Aufnahme beenden. Dann auf den Würfel und von dort auf den Kopf Ihres Echos."] },
    "Schleuse": { name: "Schleuse", quip: "Eine Schleuse. Sie schützt uns vor Ihnen. Und Sie vor sich selbst.",
      hints: ["Zwei Türen, zwei Kanäle: Gelb öffnet Gelb, Türkis öffnet Türkis. Der Würfel dafür liegt unter dem Gitter im Boden. Gut verstaut.", "Ihr Echo hält einen Schalter, für den anderen brauchen Sie den Würfel. Den bekommen Sie mit zwei Portalen aus seinem Loch.", "Lassen Sie Ihr Echo auf dem gelben Schalter stehen. Dann ein Portal durch das Gitter unter den Würfel, eins an die weiße Wand links, und den Würfel durch die gelbe Tür auf den türkisen Schalter schieben."] },
    "Lichtwache": { name: "Lichtwache", quip: "Bitte halten Sie das Tor auf. Ja, Sie. Das andere Sie.",
      hints: ["Ein Tor im Laserweg geht nur auf, solange jemand auf dem Schalter steht. Sie können nicht gleichzeitig stehen und zielen. Wir haben es beobachtet.", "Ihr Echo kann stehen. Stehen ist seine große Stärke.", "Nehmen Sie auf, wie Sie zum Schalter gehen, und beenden Sie die Aufnahme dort. Dann leiten Sie den Strahl per Portal durch das offene Tor zum türkisen Empfänger."] },
    "Doppelbelegung": { name: "Doppelbelegung", quip: "Diese Zelle ist für genau eine Person. Sie sind zwei. Rechnen Sie selbst.",
      hints: ["Neu: Schlüsselkarten. Solange eine fehlt, bleibt der Ausgang gesperrt. Eine liegt in einer Zelle, aus der niemand zurückkommt.", "Ihr Echo sammelt Karten für Sie ein, auch an Orten, die für Sie Endstation wären. Erst müssen Sie aber hinüber.", "Fliegen Sie vom Sims über ein Bodenportal aus der linken Wand hinüber. Drüben nehmen Sie auf, wie Sie per Portal durch das Gitter in die Zelle oben fallen. Ihr Echo holt die Karte, Sie gehen zum Ausgang."] },
    "Fernzündung": { name: "Fernzündung", quip: "Ein Zeitzünder, nur aus Menschen. Wir sind sehr stolz.",
      hints: ["Im Schacht holen Sie Tempo, aber das Ziel sehen Sie von dort nicht. Ein klassischer Fall von schlechter Aussicht.", "Ihr Echo kann Portale setzen, während Sie fallen. Teamarbeit über die Zeit hinweg.", "Nehmen Sie auf, wie Sie draußen warten und nach einer Weile das Portal auf den Block setzen. Dann holen Sie sich selbst Tempo in der Schleife im Schacht und lassen sich vom Echo umleiten."] },
    "Brückenwächter": { name: "Brückenwächter", quip: "Ein Wächter, eine Brücke, ein Abgrund. Klassische Gutenachtgeschichte.",
      hints: ["Die Brücke endet an einer Tür über der Säure. Die Tür öffnet nur, solange jemand auf dem Schalter steht.", "Jemand auf dem Schalter, jemand auf der Brücke. Zwei Jemande. Sie haben Glück, Sie können zwei sein.", "Nehmen Sie auf, wie Sie auf den Schalter gehen, und beenden Sie die Aufnahme. Dann legen Sie die Brücke per Portal und laufen durch die offene Tür hinüber."] },
    "Türkeil": { name: "Türkeil", quip: "Eine Tür schließt nicht, solange etwas in ihr steht. Wir halten das für einen Konstruktionsfehler. Sie für ein Werkzeug.",
      hints: ["Die Karte liegt hinter der zweiten Tür, der Ausgang ganz links, und beide Schalter liegen auf Absätzen, auf die kein Würfel kommt. Neu: Eine Tür schließt nicht, solange etwas in ihr steht.", "Ein neues Echo ersetzt das alte. Das alte verschwindet vom Schalter, und seine Tür geht zu. Es sei denn, etwas klemmt.", "Erstes Echo auf den gelben Schalter. Dann den Würfel in die gelbe Tür schieben, damit sie offen bleibt. Zweites Echo auf den türkisen Schalter, Karte holen und durch beide Türen zurück zum Ausgang."] },
    "Torwächter": { name: "Torwächter", quip: "Einer wirft, einer hält. Wie im Zirkus, nur ohne Applaus.",
      hints: ["Der Würfel muss auf den Schalter rechts, und dazwischen steht ein türkises Tor. Der Schalter für das Tor liegt unter dem Sims.", "Würfel fliegen durch Portale, und Tore bleiben offen, solange Ihr Echo es will.", "Ihr Echo hält den Schalter unter dem Sims. Dann schleudern Sie den Würfel per Portal durch das offene Tor auf den Schalter rechts und fliegen auf demselben Weg hinterher."] },
    "Leibwache": { name: "Leibwache", quip: "Ihr Echo spürt keinen Schmerz. Wir haben extra gefragt.",
      hints: ["Der Schalter öffnet den Ausgang, aber auch das Tor vor dem Laser. Dann ist der ganze Boden tödlich. Für Sie.", "Ihr Echo ist gegen Laser immun. Ein immuner Körper im Strahl ist eine Wand mit Ihrem Gesicht.", "Nehmen Sie auf, wie Sie sich so hinstellen, dass Ihr Echo den Strahl abfängt. Dann drücken Sie selbst den Schalter und gehen im Schatten zum Ausgang."] },
    "Durchflug": { name: "Durchflug", quip: "Bitte nicht gegen geschlossene Tore fliegen. Die Tore beschweren sich.",
      hints: ["Neu: Blau knisternde Böden stehen unter Strom und töten bei Berührung. Diesmal müssen Sie selbst durch das Tor fliegen. Das Tor öffnet nur, wenn jemand unten auf dem Schalter steht.", "Was Ihr Echo aufgenommen hat, tut es auch dann, wenn Sie die Portale später ändern. Treue, die man sich wünscht.", "Lassen Sie Ihr Echo unten auf dem Schalter stehen. Danach setzen Sie die Portale für den Flug und schießen sich durch das offene Tor."] },
    "Generalprobe": { name: "Generalprobe", quip: "Generalprobe. Fehler sind erlaubt. Wiederholungen auch. Viele.",
      hints: ["Die Tür will Schalter und Empfänger, und der Starkstromboden liegt wieder dazwischen. Generalprobe heißt: diesmal ohne Würfel.", "Ihr Echo kann auch Brücke fahren. Und es wartet am Ziel, solange Sie wollen.", "Legen Sie die Brücke und nehmen Sie auf, wie Sie hinüber auf den Schalter gehen. Dann setzen Sie vom anderen Ufer aus die Portale neu und leiten den Laser zum Empfänger."] },
    "Abschlussprüfung": { name: "Abschlussprüfung", quip: "Letzte Prüfung dieser Reihe. Hinter der Tür liegt Ihre Belohnung. Wirklich diesmal.",
      hints: ["Schalter in der versiegelten Zelle, Laser zum Empfänger, beides für dieselbe Tür. Die Karte liegt auch in der Zelle. Natürlich ganz oben.", "Was Ihr Echo unterwegs einsammelt, gehört Ihnen. Auch wenn es dafür springen muss.", "Nehmen Sie auf, wie Sie per Portal in die Zelle fallen, unter der Karte hochspringen und auf dem Schalter stehen bleiben. Dann die Portale neu setzen und den Laser zum Empfänger leiten. Dahinter wartet etwas Neues."] },
    "Greifarm": { name: "Greifarm", quip: "Bitte greifen Sie nur nach Würfeln. Wir hatten da schon Zwischenfälle.",
      hints: ["Neu: Gravitationskanone. G oder „Greifen“ packt einen Würfel, auch durch ein Gitter hindurch, V oder „Werfen“ schleudert ihn in Zielrichtung. Der Würfel liegt über Ihnen, der Schalter hoch rechts hinter den Flammen. Neu: Flammen verbrennen Sie sofort, Würfel nur vorübergehend.", "Greifen geht durch Gitter. Werfen geht über Flammen. Kombinieren dürfen Sie selbst, wir glauben an Sie.", "Greifen Sie den Würfel von unten durch das Gitter, zielen Sie schräg nach rechts oben und werfen Sie ihn auf den Schalter. Dann links durch die offene Tür."] },
    "Würfelschild": { name: "Würfelschild", quip: "Ein Würfel als Schild. Genau dafür wurde er nicht entworfen.",
      hints: ["Der Laser fegt über den Boden, und dazwischen liegen Starkstromflecken. Schieben reicht hier nicht, Sie müssen springen.", "Ein gehaltener Würfel schwebt dort, wohin Sie zielen. Auch zwischen Ihnen und einem Laser. Besonders dort.", "Greifen Sie den Würfel und zielen Sie Richtung Laser, sodass er vor Ihnen schwebt. So geschützt springen Sie über die Starkstromflecken zum Ausgang."] },
    "Ballistik": { name: "Ballistik", quip: "Physik-Unterricht, praktischer Teil. Theorie gab es nie.",
      hints: ["Der Schalter liegt oben, hinter einem Loch in der Decke. Hinaufklettern ist nicht vorgesehen.", "Würfel fliegen in Zielrichtung. Schräg nach oben ist auch eine Richtung.", "Greifen Sie den Würfel, stellen Sie sich nahe unter das Deckenloch und werfen Sie schräg nach oben hindurch. Er landet auf dem Schalter."] },
    "Rohrpost": { name: "Rohrpost", quip: "Sendung unterwegs. Empfänger: ein Schalter. Kein Rückschein.",
      hints: ["Der Schalter liegt in einer Zelle hinter dem Gitter, und die weiße Fläche hoch an der linken Wand erreichen Sie nicht.", "Ein geworfener Würfel erreicht Stellen, die Sie nicht erreichen. Durch Portale fliegt er sogar weiter. Neid ist hier unangebracht.", "Ein Portal hoch an die linke Wand, das andere an die Decke der Zelle hinter dem Gitter. Dann werfen Sie den Würfel in das Wandportal, er fällt in der Zelle auf den Schalter."] },
    "Katapult": { name: "Katapult", quip: "Wurfgeschoss mit Portalantrieb. Die Versicherung weiß davon nichts.",
      hints: ["Der Schalter liegt auf einer Insel hinter einer Mauer. Werfen allein reicht nicht, wir haben die Mauer extra hoch gebaut.", "Ein Wurf nach unten in ein Bodenportal ist schneller als jeder Fall. Was schnell hineingeht, kommt schnell heraus.", "Ein Portal in den Boden der Grube, eins an die linke Wand. Werfen Sie den Würfel kräftig nach unten in die Grube, er schießt aus der Wand über die Mauer auf die Insel."] },
    "Hebebühne": { name: "Hebebühne", quip: "Ihr Echo hebt für Sie. Sie heben für niemanden. Typisch.",
      hints: ["Das Sims ist zu hoch, und die Tür davor öffnet nur der Schalter oben links. Sie brauchen den Würfel also zweimal. Gleichzeitig geht nicht. Nacheinander schon.", "Ihr Echo kann einen Würfel festhalten und ihn später werfen. Es hält sich an den Plan, auch wenn Sie längst woanders sind.", "Nehmen Sie auf: Würfel greifen, nach oben zielen, an der Wand warten, bis Sie oben wären, dann den Würfel auf den Schalter werfen. Klettern Sie währenddessen über Echo und Würfel aufs Sims und warten Sie vor der Tür."] },
    "Zuspiel": { name: "Zuspiel", quip: "Pass und Torschuss. Leider ohne Publikum.",
      hints: ["Kein Wurf von hier erreicht das Regal mit dem Schalter, und das türkise Tor ist nur ein flacher Tunnel am Boden.", "Würfel kann man tragen. Auch durch Tunnel, die jemand anderes offen hält.", "Ihr Echo steht auf dem Schalter für das Tor. Dann tragen Sie den Würfel durch den Tunnel und werfen ihn von drinnen aufs Regal."] },
    "Wachwechsel": { name: "Wachwechsel", quip: "Schichtwechsel. Die eine Hälfte von Ihnen hat jetzt Feierabend.",
      hints: ["Die gelbe Tür braucht jemanden auf dem gelben Schalter, und der türkise Schalter für den Ausgang liegt hinter den Flammen.", "Ihr Echo bewacht Gelb, Ihr Würfel bewacht Türkis. Sie bewachen nichts, Sie gehen.", "Nehmen Sie auf, wie Sie auf den gelben Schalter gehen. Dann tragen Sie den Würfel durch die offene Tür über die Flammen und legen ihn auf den türkisen Schalter."] },
    "Fallrohr": { name: "Fallrohr", quip: "Einschreiben mit Höchstgeschwindigkeit. Bitte nicht im Weg stehen.",
      hints: ["Der Würfel steckt in einer Zelle, aus der Sie ihn nicht herausziehen können. Er fühlt sich dort sicher. Noch.", "Zielt die Kanone auf einen Würfel, stößt Werfen ihn weg, auch ohne Greifen. Was durch ein Portal gestoßen wird, fliegt woanders weiter.", "Ein Portal an die Rückwand der Zelle, eins dorthin, wo der Würfel herauskommen soll. Dann zielen Sie auf den Würfel und stoßen ihn mit Werfen durch das Portal."] },
    "Freie Bahn": { name: "Freie Bahn", quip: "Ein Würfel, zwei Aufgaben. Willkommen in der Wirtschaft.",
      hints: ["Der Laser soll zum Empfänger links, aber der Würfel auf dem Gitter steht im Weg. Die Tür will außerdem den Schalter.", "Ein Würfel, der im Weg steht, ist ein Würfel, der woanders gebraucht wird.", "Greifen Sie den Würfel vom Gitter und stellen Sie ihn auf den Schalter. Dann leiten Sie den Laser per Portal zum Empfänger links."] },
    "Doppelhalter": { name: "Doppelhalter", quip: "Einer sitzt in der Grube, einer wirft. Sie kennen das Prinzip.",
      hints: ["Ein Schalter liegt in einer Grube, aus der niemand herauskommt, der andere oben auf dem Regal. Sie haben einen Würfel und ein Echo.", "In die Grube gehört jemand, der nicht zurück muss. Aufs Regal gehört etwas, das man werfen kann.", "Nehmen Sie auf, wie Sie in die Grube auf den Schalter springen. Dann werfen Sie den Würfel aufs Regal."] },
    "Fernlieferung": { name: "Fernlieferung", quip: "Lieferungen durch Wände übernehmen wir nicht. Durch Türen schon.",
      hints: ["Ein Schalter liegt in einer Grube unter dem Sims, der andere oben hinter einer Tür, die erst der Grubenschalter öffnet. Von hier erreicht ihn kein Wurf.", "Ihr Echo kann den Grubenschalter übernehmen. Würfel fliegen durch Portale, und was schnell in einen Boden fällt, kommt schnell aus einer Wand.", "Nehmen Sie auf, wie Sie in die Grube auf den Schalter fallen. Dann greifen Sie den Würfel, setzen ein Portal oben links an die weiße Wand und eins in den Boden unten und werfen ihn hinein. Er fliegt durch die offene Tür auf den Schalter."] },
    "Doppelwurf": { name: "Doppelwurf", quip: "Doppelte Würfel, doppelte Freude. Die Freude ist optional.",
      hints: ["Zwei Würfel, zwei Schalter: einer oben auf der Decke, einer in der Zelle hinter dem Gitter. Fleißarbeit mit Anspruch.", "Der eine Würfel geht durch das Loch nach oben, der andere durch zwei Portale nach innen.", "Werfen Sie den ersten Würfel schräg durch das Deckenloch auf den oberen Schalter. Dann ein Portal unter die Decke, eins an die Decke der Zelle, und den zweiten Würfel hineinwerfen."] },
    "Lichtsteg": { name: "Lichtsteg", quip: "Bitte nicht mit Fracht auf Lichtbrücken springen. Na gut, dieses eine Mal.",
      hints: ["Die Brücke liegt höher als der Boden, und der Schalter liegt hinter ihr. Einen Würfel können Sie dort nicht hinaufschieben.", "Was man nicht schieben kann, kann man tragen. Sie können übrigens springen, während Sie tragen. Erstaunlich, oder?", "Legen Sie die Brücke per Portal, greifen Sie den Würfel und springen Sie mit ihm auf die Brücke. Oben tragen Sie ihn hinüber und legen ihn auf den Schalter."] },
    "Schildwache": { name: "Schildwache", quip: "Ihr Echo steht freiwillig im Laser. Freiwillig ist relativ.",
      hints: ["Ein Laser bewacht den Weg, der Schalter liegt oben auf dem Regal. Sie haben einen Würfel. Der kann entweder schützen oder schalten.", "Ihr Echo kann den Würfel als Schild tragen. Und es hält Laser aus, auch nachdem es den Würfel losgelassen hat.", "Halten Sie den Würfel als Schild nach links und nehmen Sie auf, wie Sie zum Laser gehen. Danach werfen Sie den Würfel aufs Regal, während Ihr Echo den Strahl abfängt."] },
    "Schwerkraft": { name: "Schwerkraft", quip: "Letzte Kammer. Wir sind fast ein wenig gerührt. Fast.",
      hints: ["Finale. Der Würfel steckt in einer Zelle, der Schalter liegt hinter einem Laservorhang. Alles, was Sie gelernt haben, plus ein Vorhang.", "Stoßen geht ohne Greifen, und ein Portal an der Decke spuckt Dinge von oben aus. Ein Würfel über dem Kopf ist ein Dach.", "Stoßen Sie den Würfel durch ein Portal aus der Zelle, das ihn an der Decke wieder ausspuckt. Dann tragen Sie ihn über dem Kopf durch den Laservorhang zum Schalter."] },
    "Sichtschutz": { name: "Sichtschutz", quip: "Sicherheitsprotokoll aktiv. Diese Geräte schützen die Anlage. Vor Ihnen.",
      hints: ["Neu: Turrets. Was der rote Strahl erfasst, wird nach kurzem Aufladen beschossen. Dieser hier bewacht den Weg zum Ausgang. Sehr gewissenhaft.", "Ein Würfel nimmt einem Turret die Sicht. Und hinter sich sieht ein Turret gar nichts. Wie manche Abteilungsleiter.", "Schieben Sie den Würfel vor sich her auf den Turret zu und springen Sie hinter ihm herunter. Von hinten sind Sie unsichtbar."] },
    "Selbstgespräch": { name: "Selbstgespräch", quip: "Dieses Modell ist äußerst selbstkritisch. Nutzen Sie das.",
      hints: ["Ein Turret bewacht den Ausgang, und an ihm vorbei kommen Sie nicht. Zwei weiße Flächen liegen in der Nähe. Purer Zufall.", "Turrets beschießen alles, was sie sehen. Wirklich alles. Auch sich selbst, wenn man sie lässt.", "Ein Portal in seine Blickrichtung, das andere über seinen Kopf. Dann schaut er von oben auf sich selbst und erledigt den Rest."] },
    "Gegenlicht": { name: "Gegenlicht", quip: "Bitte nicht in den Laser schauen. Das gilt auch für Turrets. Besonders für Turrets.",
      hints: ["Der Turret bewacht den ganzen Boden, und der Laser oben strahlt ins Leere. Neu für Sie: Laser brennen Turrets die Optik durch.", "Laser lassen sich umleiten, auch nach unten. Ein Strahl von oben trifft zuerst den Kopf.", "Ein Portal an die linke Wand, wo der Laser auftrifft, das andere an die Decke über dem Turret. Der Strahl fällt ihm auf den Kopf, danach ist der Boden frei."] },
    "Umzug": { name: "Umzug", quip: "Turrets kennen keine Kollegialität. Wir auch nicht.",
      hints: ["Unten wacht ein Turret vor der Tür zum Ausgang, und die Tür öffnet nur mit Gewicht auf dem Schalter hier oben. Neben Ihnen steht sein Kollege. Noch arbeitslos.", "Zwei Turrets, die sich sehen, schießen sich gegenseitig ab. Was danach übrig bleibt, wiegt immer noch genug für einen Schalter.", "Tragen Sie den oberen Turret hinunter und stellen Sie ihn so ab, dass er seinen Kollegen ansieht. Danach bringen Sie einen der Ausgefallenen wieder nach oben auf den Schalter, getragen oder geworfen."] },
    "Freiwilliger": { name: "Freiwilliger", quip: "Wir suchen einen Freiwilligen. Sie haben sich gerade selbst gemeldet.",
      hints: ["Der Schalter liegt im Blickfeld des Turrets, und unten gibt es keinen Weg zurück. Über dem Schalter schwebt außerdem eine Karte.", "Ihr Echo ist gegen Turrets immun und bleibt, wo die Aufnahme endet. Ein Freiwilliger, der nicht Nein sagen kann.", "Nehmen Sie auf, wie Sie auf den Schalter springen, und beenden Sie die Aufnahme sofort. Ihr Echo bleibt stehen und nimmt die Karte gleich mit."] },
    "Lockvogel": { name: "Lockvogel", quip: "Ihr Echo steht Modell. Der Turret ist begeistert.",
      hints: ["Oben auf dem Sims erfasst Sie der Strahl des Turrets. Der Ausgang liegt leider genau dort.", "Ein Strahl braucht freie Sicht. Ihr Echo ist kein freier Blick, sondern ein Hindernis mit Ihrem Gesicht.", "Nehmen Sie auf, wie Sie auf den Sockel springen, und beenden Sie die Aufnahme schnell. Ihr Echo verdeckt den Strahl, Sie gehen zum Ausgang."] },
    "Querschläger": { name: "Querschläger", quip: "Bitte stellen Sie die beiden einander vor. Es wird kurz.",
      hints: ["Zwei Turrets, zwei Etagen, eine Karte ganz oben rechts. Nach oben führt keine Treppe. Nach unten auch keine schöne.", "Mit zwei Portalen sehen sich die beiden Turrets. Dieselben Portale sind danach ein Aufzug.", "Ein Portal oben an die rechte Wand, eins unten an die linke, und warten. Dann gehen Sie unten links in das Portal, kommen oben heraus, holen die Karte und nehmen denselben Weg zurück."] },
    "Entsorgung": { name: "Entsorgung", quip: "Turrets sind Eigentum der Anlage. Bitte gehen Sie sorgfältig damit um. Oder auch nicht.",
      hints: ["Ein Turret bewacht den Gang, die Tür zum Ausgang will einen Schalter, und hinter dem Turret liegt eine Karte. Einen Würfel gibt es nicht.", "Von hinten sieht er Sie nicht. Und ein Turret wiegt so viel wie ein Würfel. Wir haben ihn gewogen.", "Springen Sie hinter dem Turret hinunter und holen Sie die Karte. Dann greifen Sie ihn und tragen ihn nach links auf den Schalter, Blick nach rechts. Er sieht Sie dabei nie."] },
    "Kreuzfeuer": { name: "Kreuzfeuer", quip: "Zwei Turrets, eine Tür. Wir haben Popcorn bereitgestellt.",
      hints: ["Die Tür trennt zwei Turrets, die sich nicht sehen dürfen. Oder gerade doch.", "Öffnet sich die Tür, sehen sich die Turrets. Was dann passiert, kennen Sie. Sie müssen nur nicht dazwischen stehen.", "Werfen Sie den Würfel auf den hohen Schalter und warten Sie oben, bis unten Ruhe ist. Dann hinunter zum Ausgang."] },
    "Trittstein": { name: "Trittstein", quip: "Die Stacheln sind frisch geschliffen. Auf Ihren Wunsch.",
      hints: ["Eine Stachelgrube, zu breit zum Springen. Wir haben genau nachgemessen. Zweimal.", "Stacheln sind für Würfel nur Boden. Für Sie sind sie ein Problem. Für einen Würfel unter Ihnen nicht mehr.", "Werfen Sie den Würfel mitten in die Grube und springen Sie über ihn hinüber."] },
    "Nadelkissen": { name: "Nadelkissen", quip: "Würfel sind wiederverwendbar. Sie leider nicht.",
      hints: ["Zwei Stachelgruben, ein Würfel. Der Würfel kann leider nur an einem Ort gleichzeitig sein.", "Was Sie einmal geworfen haben, können Sie von drüben wieder zu sich holen. Recycling, sozusagen.", "Werfen Sie den Würfel in die obere Grube, springen Sie hinüber und holen Sie ihn von drüben zurück. Unten brauchen Sie ihn noch einmal."] },
    "Einbahnstraße": { name: "Einbahnstraße", quip: "Sie können nicht überall gleichzeitig sein. Doch, können Sie. Nur nicht pünktlich.",
      hints: ["Die Karte liegt in der linken Grube, der Ausgang in der rechten hinter einer Tür, und aus keiner Grube kommen Sie wieder heraus. Der Schalter für die Tür liegt hier oben.", "Ihr Echo kann zwei Dinge erledigen. Nur nicht gleichzeitig. Die Reihenfolge ist alles.", "Nehmen Sie auf: erst eine Weile auf dem Schalter stehen, dann in die linke Grube zur Karte. Während Ihr Echo noch auf dem Schalter steht, springen Sie selbst rechts hinunter und gehen durch die Tür."] },
    "Podest": { name: "Podest", quip: "Turrets sind keine Möbel. Das hat Ihnen nur noch niemand gesagt.",
      hints: ["Der Ausgang liegt hoch links, davor steht ein Pfeiler mit einer Karte. Beides ist zu hoch für Sie. Für einen Turret auf Stacheln nicht.", "Ein Turret ist ein brauchbarer Tritt, auf Stacheln steht er sogar höher. Und man kann ihn mitnehmen.", "Greifen Sie den Turret von hinten und stellen Sie ihn auf das rechte Stachelfeld, Blick zur Wand. Über ihn auf den Pfeiler zur Karte. Dann holen Sie ihn nach, stellen ihn auf das linke Stachelfeld und steigen über ihn zum Ausgang."] },
    "Doppelkarte": { name: "Doppelkarte", quip: "Doppelte Sicherheit. Für uns. Für Sie doppelte Arbeit.",
      hints: ["Zwei Karten: eine in der Zelle hinter dem Gitter, eine auf dem Sims oben links. Sie stehen leider auf keinem von beiden.", "Ein Portalpaar bringt Sie in die Zelle und wieder zurück. Und eine weiße Decke ist auch ein Ausgang, nur eben nach unten.", "Ein Portal unten an die linke Wand, eins an die rechte: links hinein, in der Zelle die Karte holen, rechts zurück. Dann das rechte Portal an die weiße Decke oben links setzen und noch einmal links hineingehen. Sie fallen von oben auf das Sims."] },
    "Hochseil": { name: "Hochseil", quip: "Balancieren auf Licht. Ein Netz haben wir nicht gespannt.",
      hints: ["Die Karte liegt unten links hinter dem Starkstrom, der Ausgang hängt hoch oben links. Die Lichtbrücke dazwischen hängt für beides in der falschen Höhe.", "Lichtbrücken laufen durch Portale weiter. Sie auch. Manchmal ist der beste Weg nach oben eine Wand.", "Ein Portal links, wo die Brücke auftrifft, eins unten links knapp über dem Starkstrom, und die Karte holen. Dann das obere Portal an die weiße Wand oben rechts setzen und links unten in das Portal gehen. Sie kommen oben heraus und landen auf der Brücke zum Ausgang."] },
    "Isolator": { name: "Isolator", quip: "Gummisohlen hätten geholfen. Wir haben keine bestellt.",
      hints: ["Der Schalter liegt auf dem Starkstromboden, direkt vor Ihnen. Die Tür dahinter will ihn gedrückt. Sie wollen nicht gegrillt werden.", "Würfel leiten keinen Strom, auf ihnen stehen Sie sicher. Ein Würfel kann aber nicht gleichzeitig Trittstein und Gewicht sein.", "Werfen Sie den Würfel erst als Trittstein in die Mitte und springen Sie über ihn hinüber. Von drüben greifen Sie ihn und werfen ihn zurück auf den Schalter."] },
    "Kartenhaus": { name: "Kartenhaus", quip: "Karten, die Sie bei einem Unfall tragen, legen wir zurück. Ordnung muss sein.",
      hints: ["Die Karte schwebt über den Stacheln, der Ausgang liegt auf dem hohen Sims. Sie haben einen Würfel und ein Echo.", "Was Ihr Echo einmal hält, gibt es nicht mehr her. Überlegen Sie also, wer zuerst was bekommt.", "Holen Sie die Karte mit dem Würfel als Trittstein über den Stacheln. Erst danach nehmen Sie auf, wie Ihr Echo den Würfel als Stufe zum Sims hält, und steigen hinauf."] },
    "Erdung": { name: "Erdung", quip: "Ihr Echo ist geerdet. Im Gegensatz zu Ihnen.",
      hints: ["Beide Schalter liegen auf Starkstrom. Sie dürfen dort nicht stehen. Ihr Echo schon, nur aufnehmen lässt es sich dort nicht.", "Ihr Echo hält Strom aus. Es muss nur irgendwie auf den Boden kommen, ohne dass Sie es tun.", "Stellen Sie den Würfel auf einen Schalter und nehmen Sie auf, wie Sie auf ihn steigen. Dann ziehen Sie ihn Ihrem Echo unter den Füßen weg und auf den anderen Schalter."] },
    "Prüfstand": { name: "Prüfstand", quip: "Abschlussprüfung für Turrets. Bestanden hat noch keiner. Sie sind der Prüfer.",
      hints: ["Ein Turret bewacht den Gang, der Würfel ist Ihre einzige Deckung, und die Tür zum Ausgang will einen Schalter. Der liegt hinter dem Turret. Natürlich.", "Hinter einem Turret ist es am sichersten. Dorthin führt kein Weg über die Stacheln, aber einer durch den Boden. Und ein Turret ist auch ein Gewicht.", "Ein Portal in den Boden unter Ihnen, eins an die weiße Wand ganz rechts. Sie landen auf dem Turret. Setzen Sie ihn auf den Schalter, Blick zur Wand, springen Sie zurück ins Wandportal und gehen Sie durch die offene Tür."] },
    "Stromausfall": { name: "Stromausfall", quip: "Stromausfall. Bitte bewahren Sie Ruhe. Wir sehen Sie übrigens trotzdem.",
      hints: ["Neu: Stromausfall. Ohne Strom ist es dunkel und der Ausgang tot. Merken Sie sich den Raum, solange das Notlicht flackert. Wir sparen hier Energie, nicht Mühe.", "Der Hebel bringt den Strom zurück. Sie schalten ihn, indem Sie hineinlaufen. Bedienungsfreundlicher geht es kaum.", "Gehen Sie im Dunkeln zum Hebel und laufen Sie hinein. Dann ist Licht, und der Ausgang lebt."] },
    "Dämmerung": { name: "Dämmerung", quip: "Der Turret hat Bereitschaft. Er schläft trotzdem. Wie alle hier.",
      hints: ["Ohne Strom schläft der Turret. Mit Strom schläft er nicht. Der Ausgang braucht leider Strom.", "Der Hebel steht direkt vor dem Turret. Wer einschaltet, weckt ihn. Wer danach noch vor ihm steht, wird geweckt. Dauerhaft.", "Schalten Sie ein und gehen Sie sofort hinter den Turret oder aus seinem Blickfeld. Dann zum Ausgang."] },
    "Fernschalter": { name: "Fernschalter", quip: "Fernbedienung nach Art des Hauses: werfen.",
      hints: ["Die Lichtbrücke braucht Strom, und der Hebel steht drüben hinter der Säure. Ein Klassiker der Planungsabteilung.", "Hebel schalten nicht nur, wenn Sie hineinlaufen. Auch Würfel zählen. Würfel sind hier gleichberechtigt.", "Greifen Sie den Würfel und werfen Sie ihn in den Hebel drüben. Ziel ist das rote Licht. Dann über die Brücke."] },
    "Kaltstart": { name: "Kaltstart", quip: "Kaltstart erfolgreich. Bitte nicht wiederholen. Doch, bitte.",
      hints: ["Ohne Strom ist der Boden tot und harmlos, aber auch der Ausgang. Mit Strom kommen Sie nicht mehr hinüber. Und drüben braucht die Tür Gewicht auf dem Schalter. Ein Würfel, zwei Aufgaben.", "Ein Hebel schaltet bei allem, was hineinfliegt. Auch bei Dingen, die eigentlich schießen sollten. Solange der Strom aus ist, schläft der Turret.", "Tragen Sie den Würfel über den toten Boden und legen Sie ihn auf den Schalter. Dann greifen Sie den schlafenden Turret und werfen ihn in den Hebel. Er wacht weit weg auf, mit dem Rücken zu Ihnen."] },
    "Schildbrücke": { name: "Schildbrücke", quip: "Die Brücke ist sicher. Der Turret nicht. Für Sie.",
      hints: ["Der Hebel liegt auf Ihrem Weg, die Brücke kommt mit dem Strom. Der Turret am anderen Ende auch. Alles eine Frage des Pakets.", "Ein gehaltener Würfel schwebt zwischen Ihnen und dem, worauf Sie zielen. Auch zwischen Ihnen und einem Turret.", "Greifen Sie den Würfel und halten Sie ihn Richtung Turret vor sich. So laufen Sie durch den Hebel und über die Brücke zum Ausgang."] },
    "Rückwurf": { name: "Rückwurf", quip: "Ein Würfel, zwei Würfe. Effizienz ist auch eine Form von Faulheit. Wir bewundern das.",
      hints: ["Zwischen Ihnen und dem Ausgang liegt Starkstrom. Ohne Strom wäre er harmlos, aber ohne Strom ist auch der Ausgang tot. Der Hebel hängt unerreichbar darüber.", "Ein Würfel, der in einen Hebel fliegt, schaltet ihn. Und ein Würfel, den man wiederfindet, kann ein zweites Mal fliegen.", "Werfen Sie den Würfel in den Hebel, damit der Strom ausgeht, und gehen Sie über den toten Boden. Drüben greifen Sie den Würfel und werfen ihn zurück in den Hebel. Dann ist der Ausgang wieder an."] },
    "Schichtbeginn": { name: "Schichtbeginn", quip: "Ihre Schicht beginnt, sobald Ihr Echo es sagt.",
      hints: ["Mit Strom erwischt Sie der Turret, bevor Sie an ihm vorbei sind. Ohne Strom ist der Ausgang tot. Schichtbeginn ist für alle hart.", "Ihr Echo kann den Hebel später umlegen, als Sie es könnten. Pünktlichkeit ist seine Stärke.", "Nehmen Sie auf, wie Sie warten und dann den Hebel umlegen, und beenden Sie die Aufnahme sofort. Laufen Sie im Dunkeln los. Wenn das Licht angeht, sind Sie schon vorbei."] },
    "Kurzschluss": { name: "Kurzschluss", quip: "Kurzschluss im Sektor sieben. Nein, das waren Sie.",
      hints: ["Ein Turret bewacht die Lichtbrücke, und ohne die Brücke kommen Sie nicht zum Ausgang. Unter der Brücke knistert der Boden.", "Ohne Strom gibt es keine Brücke, und was darauf steht, fällt. Mit Strom ist der Boden darunter tödlich. Auch für Turrets. Gleiches Recht für alle.", "Schalten Sie den Strom aus, damit der Turret von der verschwundenen Brücke fällt. Schalten Sie wieder ein: Der Starkstrom erledigt ihn, und die Brücke ist frei."] },
    "Dunkelkammer": { name: "Dunkelkammer", quip: "Die Dunkelkammer. Hier entwickeln wir Testpersonen.",
      hints: ["Im Dunkeln sehen Sie nur, was um Sie herum ist. Karte und Hebel liegen auf der anderen Seite, dazwischen Gruben. Wir haben das Licht nicht vergessen, nur gestrichen.", "Das Notlicht flackert am Anfang einmal. Das ist kein Defekt, das ist Ihre einzige Landkarte.", "Merken Sie sich die Gruben beim Flackern. Springen Sie im Dunkeln hinüber, holen Sie Karte und Strom und kommen Sie im Licht zurück zum Ausgang."] },
    "Blindflug": { name: "Blindflug", quip: "Bitte zielen Sie im Dunkeln. Wir glauben an Sie. Ein bisschen.",
      hints: ["Der Laser öffnet die Tür, sobald er den Empfänger trifft. Mit Strom bewacht der Turret alles außerhalb der Nische. Auch Sie beim Zielen.", "Ohne Strom schläft der Turret, und Portale lassen sich auch im Dunkeln setzen. Wir messen hier nur die Stromrechnung.", "Setzen Sie die Portale für den Laser im Dunkeln, solange der Turret schläft. Erst danach schalten Sie ein und gehen durch die offene Tür."] },
    "Kartenleger": { name: "Kartenleger", quip: "Wir haben die Karte gut versteckt. Im Laser. Sehr gut versteckt.",
      hints: ["Die Karte liegt mitten im Laserstrahl. Der Laser braucht Strom, der Ausgang auch. Wer hat das entworfen? Ach ja, wir.", "Was mit Strom tödlich ist, ist ohne Strom nur dunkel. Der Hebel hängt direkt über Ihnen.", "Springen Sie in den Hebel, um den Strom abzuschalten, und holen Sie die Karte im Dunkeln. Zurück am Hebel schalten Sie wieder ein und gehen zum Ausgang."] },
    "Fernwartung": { name: "Fernwartung", quip: "Wartung aus der Ferne. Ihr Echo erledigt das, Sie schalten das Licht an.",
      hints: ["Der Schalter drüben öffnet die Tür zum Ausgang, aber der Ausgang braucht Strom. Und mit Strom kommen Sie nicht über den Boden.", "Ihr Echo hält Starkstrom aus. Aufnehmen lässt sich der Weg aber nur, solange der Boden tot ist.", "Nehmen Sie im Dunkeln auf, wie Sie über den Boden auf den Schalter gehen. Danach schalten Sie den Strom ein. Ihr Echo steht unbeeindruckt auf dem Schalter, Sie gehen zum Ausgang."] },
    "Hebelwirkung": { name: "Hebelwirkung", quip: "Hebelwirkung, physikalisch korrekt. Fast.",
      hints: ["Der Hebel sitzt in einer Zelle hinter Gittern, die Lichtbrücke über der Säure kommt erst mit dem Strom.", "In die Zelle passt ein Würfel, durch ein Portal. Sie passen auch hinein, aber nie wieder heraus.", "Setzen Sie ein Portal in die Zelle und lassen Sie den Würfel durch das andere hineinfallen, in die kleine Grube unter dem Hebel. Springen Sie selbst lieber nicht hinterher. Dann über die Brücke."] },
    "Türstopper": { name: "Türstopper", quip: "Bitte halten Sie die Türen frei. Oder eben nicht.",
      hints: ["Mit Strom öffnet der Laser die Tür, aber dahinter wacht der Turret. Ohne Strom schläft er, und die Tür geht zu.", "Sie kennen das schon: Eine Tür schließt nicht, solange etwas in ihr steht. Wir haben es nicht repariert. Absichtlich.", "Schalten Sie ein, damit die Tür aufgeht, und stellen Sie den Würfel hinein. Dann ausschalten: Der Turret schläft, die Tür bleibt offen. Hinter dem Turret schalten Sie mit dem zweiten Hebel wieder ein."] },
    "Sichtachse": { name: "Sichtachse", quip: "Zwei Turrets, ein Würfel, null Vertrauen.",
      hints: ["Unten bewachen zwei Turrets den Gang, mit dem Ausgang an einem Ende und der Karte am anderen. Noch ist es dunkel. Noch.", "Ohne Strom schlafen die Turrets. Mit Strom schießen sie auf alles, was sie sehen, auch aufeinander. Der Würfel ist Trittstein und Sichtschutz zugleich, aber nicht beides auf einmal.", "Im Dunkeln den Würfel durch das rechte Loch auf die Stacheln fallen lassen, selbst durch das linke hinunter und über ihn zur Karte. Dann den Würfel greifen und hochhalten, damit die Turrets sich sehen, und den Hebel einschalten. Den Würfel zurück auf die Stacheln legen und hinüber zum Ausgang."] },
    "Taktgeber": { name: "Taktgeber", quip: "Licht an, Licht aus, Licht an. Wir nennen das Präzisionsarbeit.",
      hints: ["Über die Säure kommen Sie nur mit Strom, durch das Loch und am Turret vorbei nur ohne, hinaus wieder nur mit. Ein Stundenplan, kein Raum.", "Ihr Echo kann den Hebel für Sie aus- und wieder einschalten, nach genau dem Takt, den Sie vorgeben.", "Nehmen Sie auf, wie Sie den Hebel aus- und nach einer Weile wieder einschalten. Dann laufen Sie los: mit Strom über die Säure, im Dunkeln durch das Loch, mit Strom hinaus."] },
    "Lichtschatten": { name: "Lichtschatten", quip: "Ihr Echo steht im Licht. Sie im Schatten. Sehr symbolisch.",
      hints: ["Im Gang unten liegt ein Laser, und ohne Strom gibt es keinen Ausgang. Mit Strom allerdings auch keinen Gang.", "Ihr Echo hält Laser aus und wirft einen Schatten. Es muss nur schon dort stehen, bevor das Licht angeht.", "Nehmen Sie im Dunkeln auf, wie Sie hinunter und direkt vor den Laser gehen. Dann schalten Sie ein. Ihr Echo fängt den Strahl ab, Sie gehen im Schatten zum Ausgang."] },
    "Schattenmann": { name: "Schattenmann", quip: "Ihr Echo geht voran. Sie folgen. Endlich einmal Teamarbeit.",
      hints: ["Der Turret steht direkt hinter dem Ausgang und schießt auf das Erste, was er sieht. Wir empfehlen, nicht das Erste zu sein.", "Ihr Echo ist immun und geht gern voraus. Ein Schatten, der vor Ihnen läuft.", "Nehmen Sie im Dunkeln auf, wie Sie bis vor den Turret gehen. Dann schalten Sie ein und folgen Ihrem Echo dicht zum Ausgang."] },
    "Stromstoß": { name: "Stromstoß", quip: "Turrets sind nicht wasserdicht. Und auch sonst nicht viel.",
      hints: ["Der Turret steht auf einer weißen Platte im niedrigen Gang, und an ihm kommen Sie nicht vorbei. Daneben knistert eine Grube.", "Was auf einem Bodenportal steht, fällt hindurch. Auch Turrets. Und der Starkstrom ist für Turrets genauso unangenehm wie für Sie.", "Ein Portal unter die Füße des Turrets, das andere über die Starkstromgrube. Danach parken Sie das Bodenportal besser woanders, bevor Sie selbst darüber laufen."] },
    "Umlenkung": { name: "Umlenkung", quip: "Multitasking ist in dieser Anlage ausdrücklich unerwünscht. Bei Lasern.",
      hints: ["Ein Laser, ein Turret, eine Tür mit Empfänger. Wir mussten sparen.", "Der Laser kann mehr als eine Aufgabe erfüllen. Nur nicht gleichzeitig.", "Leiten Sie den Laser erst auf den Turret. Wenn er erledigt ist, setzen Sie die Portale neu und schicken den Strahl zum Empfänger, der die Tür öffnet."] },
    "Abflug": { name: "Abflug", quip: "Bitte anschnallen. Ach, es gibt keine Gurte. Dann eben nicht.",
      hints: ["Die Karte schwebt hoch über den Stacheln, der Ausgang liegt auf einem Sims daneben. Zum Verschnaufen. Wir sind ja keine Unmenschen.", "Wer tief fällt, fliegt hoch. Das wissen Sie seit der zweiten Kammer.", "Ein Portal unten in die Grube, eins in die weiße Fläche zwischen den Stacheln. Fallen Sie hinein, fliegen Sie durch die Karte und lenken Sie nach dem Abflug zum Ausgang."] },
    "Lichtwechsel": { name: "Lichtwechsel", quip: "Strom an, Strom aus. Sie haben jetzt Befugnis über die Lichtschalter. Bitte nicht missbrauchen.",
      hints: ["Eine Karte liegt im Laser, die andere hinter der Säure. Den Laser gibt es nur mit Strom, die Brücke über die Säure auch.", "Mit Strom gibt es Brücke und Laser, ohne Strom keins von beidem. Die Reihenfolge Ihrer Schaltvorgänge ist die eigentliche Kammer.", "Holen Sie mit Strom über die Brücke die Karte hinter der Säure. Zurück am Hebel schalten Sie aus und holen die Karte, wo eben noch der Laser war. Zum Schluss wieder einschalten und hinaus."] },
    "Schranke": { name: "Schranke", quip: "Ein- und ausgeschaltet. Mit einem Würfel. Unsere Ingenieure sind beschämt.",
      hints: ["Ein Würfel hält den Laser auf, der Ausgang steht direkt dahinter. Weiter hinten wacht ein Turret über eine Karte.", "Ein angehobener Würfel lässt den Strahl durch, und Laser mögen Turrets nicht. Würfel kann man allerdings auch wieder absetzen.", "Heben Sie den Würfel durch das Gitter an, bis der Strahl den Turret erledigt. Dann setzen Sie den Würfel zurück, gehen hinunter, holen die Karte und gehen im Schatten zum Ausgang."] },
    "Vorhut": { name: "Vorhut", quip: "Ihr Echo geht durch den Strom, Sie gehen darüber. Arbeitsteilung, wie sie im Buche steht.",
      hints: ["Mit Strom liegt eine Brücke über dem Boden, und am Ende wacht der Turret. Ohne Strom ist der Boden harmlos, aber der Ausgang tot.", "Ihr Echo kann im Dunkeln vorausgehen und steht dann im Licht dem Turret im Weg. Freiwillig, versteht sich.", "Schicken Sie Ihr Echo im Dunkeln über den harmlosen Boden bis vor den Turret. Dann schalten Sie ein und folgen ihm über die Brücke."] },
    "Wechselschaltung": { name: "Wechselschaltung", quip: "Hebel, Hebel, Laser, Ausgang. Klingt wie ein Kinderreim. Ist keiner.",
      hints: ["Zwei Hebelvorhänge liegen direkt im Weg, und Sie schalten sie schon beim Durchlaufen. Über den Boden kommen Sie nur ohne Strom, durch den Laser auch, hinaus nur mit.", "Jeder Durchgang ist ein Schaltvorgang. Zählen Sie mit. Und ein Würfel kann für Sie einmal zusätzlich schalten.", "Nehmen Sie den Würfel mit, schalten Sie beim Durchlaufen und werfen Sie ihn in den Vorhang, wenn ein Schaltvorgang fehlt. Am Ende muss Strom an sein."] },
    "Wartungsschacht": { name: "Wartungsschacht", quip: "Wartungsarbeiten. Bitte halten Sie Abstand. Zu allem.",
      hints: ["Der Schalter liegt auf Starkstrom, und hinter der Tür wartet ein Turret direkt neben dem Ausgang.", "Einer von Ihnen hält den Schalter, einer hält den Würfel. Ihr Echo hält Strom aus, Sie nicht.", "Nehmen Sie im Dunkeln auf, wie Sie auf den Schalter gehen, und schalten Sie danach den Strom ein. Dann greifen Sie den Würfel, halten ihn als Schild vor sich und gehen durch die offene Tür zum Ausgang."] },
    "Blickkontakt": { name: "Blickkontakt", quip: "Wir haben die beiden einander vorgestellt. Sie waren nicht begeistert.",
      hints: ["Zwei Turrets auf zwei Etagen, zwei weiße Wände, und der Hebel liegt unten in der Grube. Sie kennen das Prinzip. Diesmal stehen Sie dazwischen.", "Mit Portalen sehen sich die Turrets, aber wer dazwischen steht, wird zuerst getroffen. Im Dunkeln sieht niemand irgendwen.", "Setzen Sie die Portale im Dunkeln, solange beide schlafen, und gehen Sie aus der Schusslinie. Erst dann schalten Sie den Strom im Hebel ein."] },
    "Rundgang": { name: "Rundgang", quip: "Eine Kammer, drei alte Bekannte. Wir nennen das Nostalgie. Sie nennen es vermutlich anders.",
      hints: ["Die Karte liegt tief in einem Schacht, der Ausgang hoch auf einem Sims rechts. Sie stehen auf einem Gitter dazwischen. Eine kleine Rundreise.", "Durch Gitter schießt man hindurch. Wer tief fällt, fliegt hoch. Und eine Echo-Aufnahme bringt Sie dorthin zurück, wo sie begann.", "Nehmen Sie auf, wie Sie vom Gitter springen und in den Schacht fallen. Ihr Echo holt die Karte, Sie stehen wieder oben. Dann ein Portal in den Boden links, eins in den Boden rechts, links hinunterfallen und rechts hinauf zum Ausgang lenken."] },
    "Lastwechsel": { name: "Lastwechsel", quip: "Lastwechsel im Netz. Bitte rechnen Sie mit Ausfällen. Vor allem bei Turrets.",
      hints: ["Der Turret steht auf der Brücke über dem Starkstrom, und die Tür öffnet nur der Schalter auf dem Starkstrom. Alles hängt am Strom.", "Ohne Strom fällt, was auf der Brücke steht, und der Boden ist harmlos. Mit Strom ist er für Turrets tödlich und für Ihr Echo egal.", "Schalten Sie aus, damit der Turret hinunterfällt, und nehmen Sie im Dunkeln auf, wie Sie auf den Schalter am Boden gehen. Dann wieder einschalten: Der Turret brennt durch, Ihr Echo hält die Tür offen, Sie gehen über die Brücke."] },
    "Hochspannungsmast": { name: "Hochspannungsmast", quip: "Ihr Echo steht unter Strom und hält Ihnen den Würfel. Mehr Loyalität gibt es nicht.",
      hints: ["Der Ausgang liegt oben auf dem Sims und braucht Strom. Vor der Wand liegt Starkstrom, und dort kann nur Ihr Echo stehen.", "Ihr Echo kann einen Würfel als Stufe hochhalten. Aufnehmen lässt sich das nur im Dunkeln, klettern lieber im Licht.", "Nehmen Sie im Dunkeln auf, wie Sie mit dem Würfel vor die Wand gehen und ihn nach oben halten. Dann schalten Sie ein und klettern: Echo, Würfel, Sims."] },
    "Bilanz": { name: "Bilanz", quip: "Drei Karten, ein Ausgang. Wir führen genau Buch.",
      hints: ["Drei Karten: eine im Laser, eine tief in der Grube, eine hinter der Säure. Laser und Brücke gibt es nur mit Strom.", "Aus der Grube kommt niemand zurück. Außer als Echo, und das muss ja nicht zurück.", "Schalten Sie aus und holen Sie die Karte im Laser. Nehmen Sie auf, wie Sie in die Grube springen. Dann schalten Sie ein und holen die letzte Karte über die Brücke hinter der Säure."] },
    "Taktgefühl": { name: "Taktgefühl", quip: "Sie haben Taktgefühl. Das steht so in Ihrer Akte. Mit Fragezeichen.",
      hints: ["Brücke, Starkstrom, Brücke. Die Brücken brauchen Strom, und die Karte unten auf dem Starkstrom erreichen Sie nur ohne.", "Ihr Echo kann den Strom für Sie im richtigen Moment aus- und wieder einschalten. Sie müssen nur rechtzeitig am richtigen Ort sein.", "Nehmen Sie auf, wie Sie den Strom aus- und nach einer Weile wieder einschalten. Dann laufen Sie los, warten auf den Säulen auf Ihren Einsatz und holen die Karte, während es dunkel ist."] },
    "Abschaltung": { name: "Abschaltung", quip: "Sie werden doch nicht den Hauptschalter anfassen. Das ist eine rhetorische Frage. Hoffentlich.",
      hints: ["Letzte Kammer. Der Notausgang öffnet sich nur, wenn die ganze Anlage ohne Strom ist. Über die Säure führt aber nur eine Brücke mit Strom, und am Ausgang wacht ein Turret.", "Der Laser oben kann den Turret erledigen, wenn Sie ihn umleiten. Und den Strom kann Ihr Echo abschalten, während Sie längst unterwegs sind.", "Setzen Sie im Dunkeln die Portale, die den Laser von oben auf den Turret lenken, und schalten Sie oben ein. Nehmen Sie auf, wie Sie in die Grube springen, die Karte holen, warten und unten ausschalten. Dann laufen Sie über die Brücke, bevor Ihr Echo das Licht ausmacht."] },
  },
  en: {
    "Erster Schritt": { name: "First Step", quip: "Welcome back. The feeling of being in two places at once is normal.",
      hints: ["The exit is up on the ledge, and your legs don't reach. New: the portal gun. White surfaces accept portals, everything else just accepts damage.", "One portal on the white wall next to you, one on the white wall by the ledge. Two holes, one room. Physics can be so accommodating.", "Blue on the wall at the bottom left, orange on the wall right next to the exit. Then just walk in. Yes, that simple. We are disappointed too."] },
    "Schwung": { name: "Momentum", quip: "Momentum is free. Unfortunately, so are spikes.",
      hints: ["Spikes lie between you and the exit. New: spikes are deadly for you. For everything else they are just decoration.", "What falls deep comes out fast. The height of your ledge is not an obstacle, it is capital.", "One portal in the floor below the ledge, one on the left wall. Drop off the right side of the ledge and fly back out over the spikes."] },
    "Würfel": { name: "Cube", quip: "The cube has no feelings. We checked.",
      hints: ["The switch wants a cube, and the cube is on the wrong side of the grille. So are you, by the way.", "Neither you nor cubes get through the grille. Portal shots do. We did not build the grille with you in mind.", "One portal on the floor next to you, one on the floor beyond the grille. Push the cube in first, then follow it and put it on the switch."] },
    "Schleife": { name: "Loop", quip: "Infinite loops are expressly permitted in this facility.",
      hints: ["The exit is at the top right, you are at the bottom left. Walking will not cut it. New: the green pool is acid. Everything goes in, nothing comes out.", "Floor and ceiling, joined by portals, make an endless loop. Every lap makes you faster. Not smarter, but faster.", "Blue in the floor, orange on the ceiling above it. While you fall, move orange to the left wall. Your momentum then carries you right to the exit."] },
    "Sprungbrett": { name: "Springboard", quip: "What falls in comes out. Physics is very consistent about that.",
      hints: ["The pillar with the exit stands behind the grille. Jumping across is pointless, we measured.", "What falls into one floor comes out of another floor just as fast. Upwards, too.", "One portal in the floor below the ledge, one in the floor behind the grille. Drop in from the ledge, get flung up and steer onto the pillar mid-air."] },
    "Zwei Schalter": { name: "Two Switches", quip: "Two switches. We did not miscount.",
      hints: ["Two switches, one door, and only one cube within reach. The second one is hiding under the grille. Shy.", "From above you can shoot through the grille. Whatever has a portal beneath it falls out somewhere else.", "Stand above the grille and put one portal on the floor under the hidden cube, the other on the white wall on the left. Then both cubes onto the switches."] },
    "Würfelwurf": { name: "Cube Toss", quip: "Please throw the cube. Not yourself.",
      hints: ["The switch is on an island past the acid, the cube on a ledge you cannot reach. An afternoon full of possibilities.", "Portals carry cubes too. Whatever leaves a wall fast flies far.", "Climb onto the ledge with a floor portal and a wall portal. Nudge the cube down into a floor portal and let it fly out of the left wall across the acid."] },
    "Aufzug": { name: "Elevator", quip: "The elevator is broken. You are the elevator now.",
      hints: ["The upper ledge is very high. Your jump is very low. That is not criticism, just an observation.", "A loop between floor and ceiling makes you fast. Fast can also point upwards.", "Link floor and ceiling and fall until you have speed. Then move the ceiling portal to the floor on the right and let it shoot you up to the upper ledge."] },
    "Lichtweg": { name: "Light Path", quip: "Laser tests. Please do not look into the beam. Or walk into it.",
      hints: ["The receiver on the right would like some light. Sadly, the laser points at the floor. Like so much around here.", "Lasers kill, portals redirect them. Whatever one floor portal swallows, the other portal spits back out.", "One portal in the floor where the beam lands, the other on the left wall at receiver height. And then please don't walk through the beam."] },
    "Doppelschicht": { name: "Double Shift", quip: "Two tasks, two portals. Budget wisely.",
      hints: ["The door wants switch and receiver, and you have exactly two portals. Mathematically that is enough. Emotionally, maybe not.", "Two jobs, one portal pair: one after the other. Cubes stay where you put them. Portals do not.", "First use the portals to get the cube out of the pit and onto the switch. Then reset the same portals and send the laser to the receiver."] },
    "Brückenschlag": { name: "Bridge Building", quip: "This bridge is made of light. You can walk on it. Please do not think about it.",
      hints: ["New: flames. Whatever falls in does not come back out. The projector on the left builds a light bridge, unfortunately into nowhere.", "Light bridges run until they hit a wall. Or a portal. Then they simply continue somewhere else.", "One portal where the bridge hits the wall, the other on the left wall just above the flames. Then walk to the exit, shoes intact."] },
    "Schutzschild": { name: "Shield", quip: "Light versus light. We are running an office pool on the outcome.",
      hints: ["The ceiling laser blocks the way. Dodging is not part of the plan.", "Light bridges stop lasers. A bridge above your head is a roof.", "Route the bridge through the floating block with two portals so it catches the beam above your head. You can only hit the block's right side from the right."] },
